function configBlock(key){
  const sheet = SHEETS[key];
  const url = state.urls[key] || "";
  const headers = state.headers[key] || [];
  const mapping = state.mapping[key] || {};
  const rowCount = (state.raw[key]||[]).length;
  const status = rowCount>0 ? `<span class="sheet-status ok">✓ ${rowCount.toLocaleString('pt-BR')} registros carregados</span>` :
    (url ? `<span class="sheet-status empty">Ainda não carregado</span>` : `<span class="sheet-status empty">Sem link definido</span>`);
  const persistWarning = (rowCount>0 && rawPersistFailed[key]) ? `
    <div class="note-box warn" style="margin-top:10px;">
      Essa aba tem <b>${rowCount.toLocaleString('pt-BR')}</b> registros — grande demais para caber no armazenamento do navegador.
      Os dados continuam aparecendo agora, mas se você recarregar a página (F5) essa aba específica vai precisar ser buscada de novo em "Carregar / Atualizar todas as fontes".
    </div>` : "";

  return `
  <div class="config-block" data-sheet="${key}">
    <h3>${sheet.label} ${status}</h3>
    <p class="hint">${sheet.hint||""} Cole o link CSV publicado da aba "${sheet.label}" da sua planilha.</p>
    <div class="config-row">
      <input type="text" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv" data-url-input="${key}" value="${esc(url)}">
      <button class="btn btn-ghost btn-sm" data-load-btn="${key}">Carregar</button>
      <button class="btn btn-ghost btn-sm" data-paste-toggle="${key}">Colar CSV manualmente</button>
    </div>
    <textarea class="textarea-fallback" data-paste-area="${key}" placeholder="Cole aqui o conteúdo CSV se o link automático não funcionar (CORS)."></textarea>
    ${persistWarning}
    ${headers.length ? mappingUI(key, sheet, headers, mapping) : ""}
  </div>`;
}
function mappingUI(key, sheet, headers, mapping){
  return `<div class="map-grid">
    ${sheet.fields.map(f=>`
      <div class="map-field ${f.required?'':'optional'}">
        <label>${f.label}</label>
        <select data-map="${key}|${f.key}">
          <option value="">— não mapear —</option>
          ${headers.map(h=>`<option value="${esc(h)}" ${mapping[f.key]===h?'selected':''}>${esc(h)}</option>`).join("")}
        </select>
      </div>`).join("")}
  </div>`;
}

function bindConfigEvents(){
  document.querySelectorAll('[data-url-input]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ state.urls[inp.dataset.urlInput] = inp.value; saveConfig(); });
  });
  document.querySelectorAll('[data-load-btn]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.loadBtn;
      const input = document.querySelector(`[data-url-input="${key}"]`);
      state.urls[key] = input.value;
      await loadSheetWithFeedback(key);
    });
  });
  document.querySelectorAll('[data-paste-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.pasteToggle;
      const ta = document.querySelector(`[data-paste-area="${key}"]`);
      ta.style.display = ta.style.display==="block" ? "none" : "block";
      if(ta.style.display==="block" && !ta.dataset.bound){
        ta.dataset.bound = "1";
        ta.addEventListener('change', ()=>{
          if(ta.value.trim()){
            loadPastedCsv(key, ta.value);
            normalizeSheetIfMapped(key);
            saveConfig();
            saveRawData(key);
            renderScreen();
          }
        });
      }
    });
  });
  document.querySelectorAll('[data-map]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const [key, field] = sel.dataset.map.split("|");
      if(!state.mapping[key]) state.mapping[key] = {};
      state.mapping[key][field] = sel.value || undefined;
      normalizeSheet(key);
      saveConfig();
      updateSidebarStatus();
    });
  });
  document.getElementById('btnLoadAll')?.addEventListener('click', loadAllSheets);
  document.getElementById('btnSaveConfig')?.addEventListener('click', ()=>{ saveConfig(); alert('Configuração salva.'); });
  document.getElementById('btnExportConfig')?.addEventListener('click', exportConfig);
  document.getElementById('btnExportSnapshot')?.addEventListener('click', exportPublishedSnapshot);
  document.getElementById('btnCopyDefaultsCode')?.addEventListener('click', copyDefaultsCodeToClipboard);
  document.getElementById('btnImportConfig')?.addEventListener('click', ()=>{
    document.getElementById('importConfigInput').click();
  });
  document.getElementById('importConfigInput')?.addEventListener('change', (e)=>{
    if(e.target.files && e.target.files[0]) importConfigFile(e.target.files[0]);
  });
}

function exportConfig(){
  const data = JSON.stringify({urls: state.urls, mapping: state.mapping}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'agility-insights-config.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importConfigFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      state.urls = parsed.urls || {};
      state.mapping = parsed.mapping || {};
      saveConfig();
      renderScreen();
      updateSidebarStatus();
      alert('Configuração importada com sucesso. Clique em "Carregar / Atualizar todas as fontes" para buscar os dados.');
    }catch(err){
      alert('Não foi possível ler esse arquivo como configuração válida.');
    }
  };
  reader.readAsText(file);
}
function normalizeSheetIfMapped(key){ if(state.mapping[key]) normalizeSheet(key); }

async function loadSheetWithFeedback(key){
  loadGeneration++;
  const myGen = loadGeneration;
  showLoading(`Carregando ${SHEETS[key].label}...`);
  const res = await fetchSheet(key, count=>{
    if(myGen!==loadGeneration) return;
    showLoading(`Carregando ${SHEETS[key].label}... ${count.toLocaleString('pt-BR')} linhas`);
  });
  if(myGen!==loadGeneration) return; // foi cancelado — não sobrescreve o que o usuário está vendo agora
  hideLoading();
  if(!res.ok){
    const ta = document.querySelector(`[data-paste-area="${key}"]`);
    if(ta) ta.style.display = "block";
    const block = document.querySelector(`.config-block[data-sheet="${key}"]`);
    if(block && !block.querySelector('.fetch-error-note')){
      const note = document.createElement('div');
      note.className = 'note-box warn fetch-error-note';
      const msg = res.reason==="timeout"
        ? `O carregamento passou de 2min30 e foi interrompido automaticamente. Se essa aba for muito grande, considere republicar só as colunas necessárias (ou uma versão resumida por dia/agente), ou use "Colar CSV manualmente" abaixo.`
        : `Não foi possível buscar esse link automaticamente (provavelmente CORS, link não publicado, ou a rede caiu no meio do carregamento). Use "Colar CSV manualmente" acima como alternativa.`;
      note.innerHTML = msg;
      block.appendChild(note);
    }
  } else {
    normalizeSheetIfMapped(key);
    saveConfig();
    await saveRawData(key);
  }
  renderScreen();
  updateSidebarStatus();
}
async function loadAllSheets(){
  loadGeneration++;
  const myGen = loadGeneration;
  for(const key of Object.keys(SHEETS)){
    if(myGen!==loadGeneration) return; // cancelado no meio do processo
    if(state.urls[key]){
      showLoading(`Carregando ${SHEETS[key].label}...`);
      const res = await fetchSheet(key, count=>{
        if(myGen!==loadGeneration) return;
        showLoading(`Carregando ${SHEETS[key].label}... ${count.toLocaleString('pt-BR')} linhas`);
      });
      if(myGen!==loadGeneration) return; // cancelado durante esta aba
      if(res.ok){ normalizeSheetIfMapped(key); await saveRawData(key); }
      else if(res.reason==="timeout"){
        showLoading(`${SHEETS[key].label} demorou demais e foi pulada (mais de 2min30). Tentando a próxima...`);
        await new Promise(r=>setTimeout(r, 1200));
      }
    }
  }
  if(myGen!==loadGeneration) return;
  saveConfig();
  hideLoading();
  renderScreen();
  updateSidebarStatus();
}
async function refreshAllData(){ await loadAllSheets(); }

function cancelLoading(){
  loadGeneration++; // invalida qualquer callback pendente de carregamentos em andamento
  hideLoading();
  renderScreen();
  updateSidebarStatus();
}

function showLoading(text){
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingOverlay').style.display = 'flex';
}
function hideLoading(){ document.getElementById('loadingOverlay').style.display = 'none'; }

function updateSidebarStatus(){
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const loaded = Object.keys(SHEETS).filter(k=>(state.raw[k]||[]).length>0);
  if(loaded.length===0){ dot.className='status-dot off'; text.textContent='Nenhuma fonte conectada'; }
  else if(loaded.length<Object.keys(SHEETS).length){ dot.className='status-dot warn'; text.textContent=`${loaded.length}/${Object.keys(SHEETS).length} fontes conectadas`; }
  else { dot.className='status-dot'; text.textContent='Todas as fontes conectadas'; }
}


/* ============================================================
   BOOTSTRAP
   ------------------------------------------------------------
   Ao abrir (ou apertar F5), o painel busca a versão mais recente das
   planilhas automaticamente, usando os links salvos neste navegador OU os
   links padrão embutidos no código (DEFAULT_URLS) — o que faz o site
   funcionar "ao vivo" para qualquer pessoa, mesmo sem nenhuma configuração
   prévia no navegador dela.

   - Se já existem dados em cache (deste navegador): mostramos a tela de
     Visão Geral IMEDIATAMENTE com o que já está salvo, e a busca ao vivo
     roda por baixo dos panos (indicador discreto no topo) — só atualiza os
     números quando terminar com sucesso. Se a busca falhar, os dados em
     cache continuam na tela, nada desaparece.
   - Se este navegador nunca carregou nada (ex.: primeira vez que alguém
     abre o link): mostramos a tela de carregamento (com botão Cancelar)
     enquanto busca pela primeira vez. Se não conseguir, tentamos o arquivo
     estático publicado (agility-data.json), e só então caímos na tela de
     Configuração, para conectar as fontes manualmente. */
async function initApp(){
  renderNav();
  await loadConfig();
  await loadAllRawData();
  document.getElementById('menuToggle').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('open');
  });
  document.getElementById('btnCancelLoad').addEventListener('click', cancelLoading);

  if(hasAnyData()){
    normalizeAllSheets();
    goToScreen("overview");
    updateSidebarStatus();
    backgroundAutoRefresh(); // atualiza por baixo dos panos, sem apagar o que já está na tela
  } else {
    const gotLive = await foregroundAutoRefresh();
    if(!gotLive) await loadPublishedSnapshotIfNeeded();
    normalizeAllSheets();
    goToScreen(hasAnyData() ? "overview" : "config");
    updateSidebarStatus();
  }
}
window.addEventListener('DOMContentLoaded', initApp);
