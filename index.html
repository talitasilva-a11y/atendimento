<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agility Insights — Painel de Atendimento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --purple:#7063F0;
  --purple-dark:#5347d1;
  --purple-deep:#372E99;
  --purple-mid:#9C93F5;
  --purple-light:#EEEBFF;
  --purple-pale:#B3ABF7;
  --orange:#FF7029;
  --orange-warn:#FFA35C;
  --orange-deep:#C2500F;
  --orange-deep2:#99400C;
  --orange-light:#FFE9DD;
  --orange-pale:#FFCBA3;
  --dark:#1C1F26;
  --dark-2:#262A33;
  --dark-3:#333846;
  --bg:#F5F6FA;
  --card:#FFFFFF;
  --text:#1C1F26;
  --text-muted:#6B7280;
  --border:#E7E8EF;
  --silver:#9CA3AF;
  --radius:14px;
  --shadow:0 2px 10px rgba(28,31,38,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Sora',sans-serif;margin:0;letter-spacing:-0.01em;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D8D9E4;border-radius:8px;}
button{font-family:inherit;cursor:pointer;}
a{color:var(--purple);text-decoration:none;}
table{border-collapse:collapse;width:100%;}
input,select{font-family:inherit;}

/* ---------- LAYOUT ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:230px;flex:none;background:var(--dark);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.sidebar-logo{
  padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08);
}
.sidebar-logo img{width:150px;display:block;}
.nav{flex:1;padding:14px 10px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;margin-bottom:2px;border-radius:10px;
  color:#B7BAC6;font-size:13.5px;font-weight:500;
  cursor:pointer;position:relative;transition:background .15s,color .15s;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--purple);color:#fff;}
.nav-item.active::before{
  content:"›";position:absolute;left:-2px;top:50%;transform:translateY(-50%);
  color:var(--orange);font-size:18px;font-weight:800;font-family:'Sora',sans-serif;
  display:none;
}
.nav-icon{width:17px;height:17px;flex:none;display:flex;align-items:center;justify-content:center;}
.nav-icon svg{width:100%;height:100%;}
.nav-section-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:#5C6070;
  padding:16px 14px 6px;font-weight:700;
}
.sidebar-footer{padding:14px;border-top:1px solid rgba(255,255,255,0.08);}
.status-pill{
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8B8F9E;padding:6px 8px;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--purple);flex:none;}
.status-dot.off{background:#5C6070;}
.status-dot.warn{background:var(--orange);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;position:sticky;top:0;z-index:20;flex-wrap:wrap;
}
.topbar-title{display:flex;align-items:center;gap:10px;}
.topbar-title .chevron{color:var(--orange);font-family:'Sora',sans-serif;font-weight:800;font-size:20px;}
.topbar-title h1{font-size:19px;}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.filter-select{
  border:1px solid var(--border);background:var(--bg);border-radius:9px;
  padding:8px 10px;font-size:12.5px;color:var(--text);min-width:110px;
}
.btn{
  border:none;border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:var(--purple);color:#fff;}
.btn-primary:hover{background:var(--purple-dark);}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{background:#ECEDF3;}
.btn-sm{padding:6px 10px;font-size:11.5px;}

.content{padding:24px 28px 60px;flex:1;}
.screen{display:none;}
.screen.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.section-title{
  display:flex;align-items:center;gap:8px;margin:28px 0 14px;font-size:15px;font-weight:700;color:var(--text);
}
.section-title:first-child{margin-top:0;}
.section-title .chev{color:var(--orange);font-weight:800;font-family:'Sora',sans-serif;}

/* ---------- KPI CARDS ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
.kpi-card{
  background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.kpi-label{font-size:11.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.kpi-value{font-family:'Sora',sans-serif;font-size:26px;font-weight:700;color:var(--text);}
.kpi-sub{font-size:11.5px;color:var(--text-muted);margin-top:4px;}
.kpi-badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;}
.badge-good{background:var(--purple-light);color:var(--purple-dark);}
.badge-bad{background:#FFDEC4;color:var(--orange-deep2);}
.badge-neutral{background:var(--purple-light);color:var(--purple-dark);}

.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;}
.grid-auto .card-wide{grid-column:1 / -1;}
@media(max-width:1000px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.card{
  background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.card-title{font-size:13.5px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.card-title small{color:var(--text-muted);font-weight:500;font-size:11.5px;}
.chart-wrap{position:relative;height:260px;}
.chart-wrap.tall{height:320px;}

/* ---------- TABLES ---------- */
.table-wrap{overflow-x:auto;}
table.data-table{font-size:12.5px;}
table.data-table th{
  text-align:left;padding:9px 12px;color:var(--text-muted);font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border);white-space:nowrap;
  cursor:pointer;user-select:none;
}
table.data-table th:hover{color:var(--purple);}
table.data-table td{padding:9px 12px;border-bottom:1px solid #F0F0F5;white-space:nowrap;}
table.data-table tbody tr:hover{background:#FAFAFD;}
.pill{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;}
.pill-green{background:var(--purple-light);color:var(--purple-dark);}
.pill-orange{background:var(--orange-light);color:var(--orange-deep);}
.pill-red{background:#FFDEC4;color:var(--orange-deep2);}
.pill-purple{background:var(--purple-light);color:var(--purple-dark);}
.pill-gray{background:#EEF0F4;color:var(--text-muted);}

/* ---------- RANKING (gamificado) ---------- */
.ranking-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--card);padding:6px;border-radius:14px;
  border:1px solid var(--border);width:fit-content;box-shadow:var(--shadow);flex-wrap:wrap;}
.rtab{
  display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:none;background:transparent;
  font-size:12.5px;font-weight:600;color:var(--text-muted);
}
.rtab svg{width:15px;height:15px;}
.rtab.active{background:var(--purple);color:#fff;}
.rank-list{display:flex;flex-direction:column;gap:10px;}
.rank-row{
  display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 18px;box-shadow:var(--shadow);
}
.rank-pos{
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-weight:800;font-size:13px;color:#fff;background:#C9CBD6;flex:none;
}
.rank-row.top1 .rank-pos{background:linear-gradient(135deg,#FFA35C,#FF7029);}
.rank-row.top2 .rank-pos{background:linear-gradient(135deg,#C9CDD6,#9CA3AF);}
.rank-row.top3 .rank-pos{background:linear-gradient(135deg,#B3ABF7,#7063F0);}
.rank-avatar{
  width:42px;height:42px;border-radius:50%;background:var(--purple-light);color:var(--purple-dark);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;
  font-family:'Sora',sans-serif;
}
.rank-info{flex:1;min-width:0;}
.rank-name{font-weight:700;font-size:13.5px;color:var(--text);}
.rank-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.rank-score{text-align:right;flex:none;}
.rank-score .val{font-family:'Sora',sans-serif;font-weight:800;font-size:16px;}
.rank-badge{
  font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:3px;display:inline-block;
}
.rank-row.top1 .rank-badge{background:var(--orange-light);color:var(--orange-deep2);}
.rank-row.top2 .rank-badge{background:#F1F2F5;color:#565C6B;}
.rank-row.top3 .rank-badge{background:var(--purple-light);color:var(--purple-dark);}
.rank-row:not(.top1):not(.top2):not(.top3) .rank-badge{background:var(--purple-light);color:var(--purple-dark);}

/* ---------- CONFIG SCREEN ---------- */
.config-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
.config-block h3{font-size:14.5px;margin-bottom:4px;}
.config-block p.hint{color:var(--text-muted);font-size:12px;margin:4px 0 14px;line-height:1.5;}
.config-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.config-row input[type=text]{
  flex:1;min-width:260px;border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:12.5px;
}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px;}
.map-field{display:flex;flex-direction:column;gap:4px;}
.map-field label{font-size:11.5px;color:var(--text-muted);font-weight:600;}
.map-field select{border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12px;}
.map-field.optional label::after{content:" (opcional)";color:#B6B9C4;font-weight:400;}
.sheet-status{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
.sheet-status.ok{background:var(--purple-light);color:var(--purple-dark);}
.sheet-status.err{background:#FFDEC4;color:var(--orange-deep2);}
.sheet-status.empty{background:#EEF0F4;color:var(--text-muted);}
.textarea-fallback{width:100%;min-height:90px;border:1px solid var(--border);border-radius:9px;padding:10px;font-size:11.5px;font-family:monospace;margin-top:8px;display:none;}
.note-box{
  background:var(--purple-light);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--purple-dark);
  line-height:1.5;margin-top:8px;
}
.note-box.warn{background:var(--orange-light);color:var(--orange-deep2);}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state svg{width:52px;height:52px;margin-bottom:14px;opacity:.5;}
.empty-state h3{color:var(--text);margin-bottom:6px;}
.empty-state .btn{margin-top:16px;}

.loading-overlay{position:fixed;inset:0;background:rgba(28,31,38,0.4);display:none;align-items:center;justify-content:center;z-index:100;}
.loading-box{background:#fff;padding:24px 34px;border-radius:14px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:12px;}
.spinner{width:18px;height:18px;border:3px solid var(--purple-light);border-top-color:var(--purple);border-radius:50%;animation:spin 0.7s linear infinite;}
.sync-indicator{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-muted);font-weight:500;margin-left:4px;}
.spinner-sm{width:11px;height:11px;border:2px solid var(--purple-light);border-top-color:var(--purple);border-radius:50%;animation:spin 0.7s linear infinite;flex:none;}
@keyframes spin{to{transform:rotate(360deg);}}

.legend-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--text-muted);}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}

@media(max-width:900px){
  .sidebar{position:fixed;left:-230px;transition:left .2s;z-index:50;}
  .sidebar.open{left:0;}
  .content{padding:18px 14px;}
  .topbar{padding:12px 14px;}
}
.menu-toggle{display:none;background:none;border:none;padding:6px;}
.menu-toggle svg{width:22px;height:22px;}
@media(max-width:900px){.menu-toggle{display:flex;}}

/* ---------- LOGIN ---------- */
.login-screen{
  position:fixed;inset:0;background:#F5F6FA;
  display:flex;align-items:center;justify-content:center;z-index:9999;
}
.login-box{
  background:#fff;padding:36px 32px;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,0.12);
  width:100%;max-width:340px;text-align:center;
}
.login-box h2{font-family:'Sora',sans-serif;margin-bottom:6px;}
.login-box p{color:#6B7280;font-size:13px;margin-bottom:20px;}
.login-box input{
  width:100%;padding:11px 13px;margin-bottom:12px;border:1px solid #E7E8EF;
  border-radius:9px;font-size:13.5px;box-sizing:border-box;
}
.login-box button{width:100%;padding:11px;font-size:14px;margin-top:6px;}
.login-error{color:#C2500F;font-size:12px;margin-top:10px;min-height:16px;}
.login-user-info{font-size:11.5px;color:#8B8F9E;padding:8px;}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h2>Agility Insights</h2>
    <p>Faça login para acessar o painel</p>
    <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Senha" autocomplete="current-password">
    <button id="btnLogin" class="btn btn-primary">Entrar</button>
    <p id="loginError" class="login-error"></p>
  </div>
</div>

<div id="app" style="visibility:hidden;">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo"><img src="logo.png" alt="Agility Soluções" onerror="this.onerror=null;this.style.display='none';this.insertAdjacentHTML('afterend','<div style=&quot;color:#fff;font-family:Sora,sans-serif;font-weight:800;font-size:16px;letter-spacing:.03em;&quot;>AGILITY<br><span style=&quot;color:#FF7029;font-size:11px;font-weight:600;letter-spacing:.08em;&quot;>SOLUÇÕES</span></div>')"></div>
    <div class="nav" id="navList"></div>
    <div class="sidebar-footer">
      <div class="status-pill"><span class="status-dot off" id="statusDot"></span><span id="statusText">Nenhuma fonte conectada</span></div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title">
        <button class="menu-toggle" id="menuToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <span class="chevron">›</span>
        <h1 id="screenTitle">Visão Geral</h1>
        <span id="syncIndicator" class="sync-indicator" style="display:none;"><span class="spinner-sm"></span>Atualizando dados...</span>
      </div>
      <div class="filters" id="globalFilters"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box"><div class="spinner"></div><span id="loadingText">Carregando dados...</span>
    <button class="btn btn-ghost btn-sm" id="btnCancelLoad" style="margin-left:6px;">Cancelar</button>
  </div>
</div>
</body>
<script>
/* ============================================================
   AGILITY INSIGHTS — Painel de Atendimento (via Supabase)
   ============================================================ */
const PAUSE_TYPE_RULES = [
  {match:["particular"], limitSec:5*60, alertOnly:true},
  {match:["refei"], limitSec:60*60},
  {match:["descanso"], limitSec:null, dependsOnSetor:true},
  {match:["backoffice"], limitSec:4*3600},
  {match:["contato ativo"], limitSec:4*3600},
  {match:["sa\u00fade","saude"], limitSec:60*60, alertOnly:true},
  {match:["feedback"], limitSec:60*60, alertOnly:true},
  {match:["reuni"], limitSec:60*60, alertOnly:true},
];
function pauseLimitSecFor(tipoRaw, setorRaw){
  const tipo = (tipoRaw||"").toLowerCase();
  const setor = (setorRaw||"").toLowerCase();
  for(const p of PAUSE_TYPE_RULES){
    if(p.match.some(m=>tipo.includes(m))){
      if(p.dependsOnSetor){
        const isCAR = setor.includes("conta") && setor.includes("receber");
        return isCAR ? 15*60 : 10*60;
      }
      return p.limitSec;
    }
  }
  return null;
}
function pauseIsAlertOnly(tipoRaw){
  const tipo = (tipoRaw||"").toLowerCase();
  const rule = PAUSE_TYPE_RULES.find(p=>p.match.some(m=>tipo.includes(m)));
  return rule ? !!rule.alertOnly : false;
}

const SHEETS = {
  received: { label: "Chamadas Recebidas", fields: [
    {key:"data"},{key:"agente"},{key:"contato"},{key:"setor"},{key:"status"},{key:"quemDesligou"},
    {key:"transferDe"},{key:"transferPara"},{key:"tempoEspera"},{key:"tempoLigacao"} ] },
  made: { label: "Chamadas Realizadas", fields: [
    {key:"data"},{key:"destino"},{key:"agente"},{key:"setor"},{key:"status"},{key:"transferPara"},{key:"tempoLigacao"} ] },
  chat: { label: "Chat (registros)", fields: [ {key:"data"},{key:"agente"},{key:"setor"} ] },
  chatPerf: { label: "Performance Chat", fields: [
    {key:"data"},{key:"agente"},{key:"setor"},{key:"conversasSat"},{key:"satisfacaoMedia"},{key:"total"},{key:"tma"},{key:"tmeResp"} ] },
  satisfaction: { label: "Satisfação (CSAT)", fields: [
    {key:"data"},{key:"agente"},{key:"setor"},{key:"canal"},{key:"nota"} ] },
  monitoring: { label: "Monitoria", fields: [
    {key:"data"},{key:"agente"},{key:"setor"},{key:"nota"},{key:"canal"} ] },
  pause: { label: "Pausa", fields: [
    {key:"data"},{key:"agente"},{key:"setor"},{key:"tipo"},{key:"duracao"} ] }
};

let state = {
  mapping: {},
  raw: {},
  rows: {},
  filters: { period: "all", setor: "all", agente: "all", canal: "all" }
};

function toNumber(v){
  if(v===undefined||v===null||v==="") return NaN;
  if(typeof v==="number") return v;
  const raw = String(v).trim();
  if(raw==="-"||raw==="") return NaN;
  if(/^-?\d+(\.\d+)?$/.test(raw)) return parseFloat(raw);
  if(/^-?\d{1,3}(\.\d{3})*(,\d+)?$/.test(raw)) return parseFloat(raw.replace(/\./g,"").replace(",","."));
  if(/^-?\d+,\d+$/.test(raw)) return parseFloat(raw.replace(",","."));
  const f = parseFloat(raw);
  return isNaN(f)?NaN:f;
}
function parseDateFlexible(v){
  if(!v) return null;
  if(v instanceof Date) return v;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    let [_, d, mo, y, h, mi, se] = m;
    if(y.length===2) y = "20"+y;
    return new Date(+y, +mo-1, +d, +(h||0), +(mi||0), +(se||0));
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    let [_, y, mo, d, h, mi, se] = m;
    return new Date(+y, +mo-1, +d, +(h||0), +(mi||0), +(se||0));
  }
  const dd = new Date(s);
  return isNaN(dd.getTime()) ? null : dd;
}
function durationToSeconds(v){
  if(v===undefined||v===null||v==="") return NaN;
  const s = String(v).trim();

    <span class="nav-icon">${item.icon}</span><span>${item.label}</span></div>`;
}
function goToScreen(key){
  currentScreen = key;
  renderNav();
  const titles = {overview:"Visão Geral", sector:"Por Setor", ranking:"Ranking de Agentes",
    queue:"Fila & SLA", chat:"Chat & Transferências", pause:"Pausas"};
  document.getElementById('screenTitle').textContent = titles[key] || key;
  renderGlobalFilters();
  renderScreen();
}
function renderGlobalFilters(){
  const box = document.getElementById('globalFilters');
  if(!hasAnyData()){ box.innerHTML = ""; return; }
  const setores = allSetores();
  const agentes = allAgentes();
  const months = allMonthsAvailable();
  box.innerHTML = `
    <select class="filter-select" id="fPeriod">
      <option value="all">Todos os meses</option>
      ${months.map(m=>`<option value="${m}">${monthLabelFromISO(m)}</option>`).join("")}
    </select>
    <select class="filter-select" id="fSetor"><option value="all">Todos os setores</option>${setores.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("")}</select>
    ${currentScreen==="ranking"||currentScreen==="pause" ? `<select class="filter-select" id="fAgente"><option value="all">Todos os agentes</option>${agentes.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("")}</select>` : ""}
    ${currentScreen!=="pause" ? `<select class="filter-select" id="fCanal"><option value="all">Todos os canais</option><option value="Receptivo">Receptivo</option><option value="Ativo">Ativo</option><option value="Chat">Chat</option></select>` : ""}
    <button class="btn btn-ghost btn-sm" id="btnRefresh">↻ Atualizar dados</button>
  `;
  document.getElementById('fPeriod').value = state.filters.period;
  document.getElementById('fSetor').value = state.filters.setor;
  if(document.getElementById('fCanal')) document.getElementById('fCanal').value = state.filters.canal;
  if(document.getElementById('fAgente')) document.getElementById('fAgente').value = state.filters.agente;
  document.getElementById('fPeriod').addEventListener('change', e=>{state.filters.period=e.target.value; renderScreen();});
  document.getElementById('fSetor').addEventListener('change', e=>{state.filters.setor=e.target.value; renderScreen();});
  if(document.getElementById('fCanal')) document.getElementById('fCanal').addEventListener('change', e=>{state.filters.canal=e.target.value; renderScreen();});
  if(document.getElementById('fAgente')) document.getElementById('fAgente').addEventListener('change', e=>{state.filters.agente=e.target.value; renderScreen();});
  document.getElementById('btnRefresh').addEventListener('click', refreshAllData);
}
function destroyCharts(){ Object.values(charts).forEach(c=>c && c.destroy && c.destroy()); charts = {}; }
function renderScreen(){
  destroyCharts();
  const content = document.getElementById('content');
  if(!hasAnyData()){ content.innerHTML = emptyState(); return; }
  if(currentScreen==="overview"){ content.innerHTML = renderOverview(); afterRenderOverview(); }
  else if(currentScreen==="sector"){ content.innerHTML = renderSector(); afterRenderSector(); }
  else if(currentScreen==="ranking"){ content.innerHTML = renderRanking(); afterRenderRanking(); }
  else if(currentScreen==="queue"){ content.innerHTML = renderQueue(); afterRenderQueue(); }
  else if(currentScreen==="chat"){ content.innerHTML = renderChat(); afterRenderChat(); }
  else if(currentScreen==="pause"){ content.innerHTML = renderPause(); afterRenderPause(); }
  bindScreenEvents();
}
function emptyState(){
  return `<div class="empty-state">${ICONS.overview}<h3>Nenhum dado encontrado para o seu acesso</h3>
    <p>Se você acredita que isso é um erro, entre em contato com o administrador do painel.</p></div>`;
}
function bindScreenEvents(){
  document.querySelectorAll('[data-rank-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{ rankingCategory = el.dataset.rankTab; renderScreen(); });
  });
}
function showChartError(canvasId, err){
  const canvas = document.getElementById(canvasId);
  if(!canvas || !canvas.parentElement) return;
  canvas.parentElement.innerHTML = `<p class="kpi-sub" style="color:var(--orange-deep);">Não foi possível desenhar este gráfico (${(err&&err.message)||'erro desconhecido'}).</p>`;
}
function baseChartOpts(){
  return {responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
    scales:{ x:{grid:{display:false}, ticks:{font:{size:10}}}, y:{grid:{color:'#F0F0F5'}, ticks:{font:{size:10}}} }};
}
function kpiCard(label, value, sub, badge){
  return `<div class="kpi-card"><div class="kpi-label"><span>${label}</span>${badge||""}</div>
    <div class="kpi-value">${value}</div>${sub?`<div class="kpi-sub">${sub}</div>`:""}</div>`;
}
function badgeFor(v, goodThreshold){
  if(!isFinite(v)) return "";
  return v>=goodThreshold ? `<span class="kpi-badge badge-good">bom</span>` : `<span class="kpi-badge badge-bad">atenção</span>`;
}
const SETOR_PALETTE = ['#7063F0','#FF7029','#5347D1','#FFA35C','#9C93F5','#C2500F','#372E99','#FFCBA3','#B3ABF7','#99400C','#6B7280','#2A2E38'];
function colorForIndex(i){ return SETOR_PALETTE[i % SETOR_PALETTE.length]; }
const RISK_GOOD = '#7063F0'; const RISK_WARN = '#FFA35C'; const RISK_BAD = '#FF7029';
function riskColor(v, goodThreshold, warnThreshold, invert=false){
  if(!isFinite(v)) return '#9CA3AF';
  let val = invert ? 1-v : v; let good = invert ? 1-goodThreshold : goodThreshold; let warn = invert ? 1-warnThreshold : warnThreshold;
  if(val>=good) return RISK_GOOD; if(val>=warn) return RISK_WARN; return RISK_BAD;
}
function heatColorForRank(value, maxValue){
  if(!isFinite(value) || !maxValue) return RISK_WARN;
  const t = Math.max(0, Math.min(1, value/maxValue));
  const from = [255,203,163], to=[153,64,12];
  const rgb = from.map((c,i)=>Math.round(c + (to[i]-c)*t));
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}
function chartCard(title, canvasId, opts={}){
  const height = opts.height || 280;
  return `<div class="card ${opts.wide!==false ? "card-wide" : ""}"><div class="card-title">${title}</div>
    <div style="height:${height}px;"><canvas id="${canvasId}"></canvas></div></div>`;
}
function horizontalBarChart(canvasId, labels, data, colors, opts={}){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return null;
  try{
    return new Chart(canvas.getContext('2d'), {
      type:'bar', data:{ labels, datasets:[{ data, backgroundColor:colors, borderRadius:6, maxBarThickness:34 }] },
      options:{ ...baseChartOpts(), indexAxis:'y',
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(ctx)=> opts.tooltipFmt ? opts.tooltipFmt(ctx.parsed.x, ctx.dataIndex) : fmtNum(ctx.parsed.x) } } },
        scales:{ x:{ grid:{color:'#F0F0F5'}, ticks:{font:{size:10}, callback:opts.xTickFmt || undefined} }, y:{ grid:{display:false}, ticks:{font:{size:11}} } }
      }
    });
  }catch(err){ showChartError(canvasId, err); return null; }
}
function doughnutChart(canvasId, labels, data, colors, opts={}){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return null;
  try{
    const total = data.reduce((a,b)=>a+b,0);
    const centerTextPlugin = { id:'centerText_'+canvasId, afterDraw(chart){
        if(!opts.centerText) return;
        const {ctx, chartArea:{left,right,top,bottom}} = chart;
        const cx=(left+right)/2, cy=(top+bottom)/2;
        ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.font='800 18px Sora, sans-serif'; ctx.fillStyle='#1C1F26'; ctx.fillText(opts.centerText(total), cx, cy-8);
        ctx.font='500 11px Inter, sans-serif'; ctx.fillStyle='#6B7280'; ctx.fillText(opts.centerSub||'', cx, cy+12);
        ctx.restore();
    }};
    return new Chart(canvas.getContext('2d'), {
      type:'doughnut', data:{ labels, datasets:[{ data, backgroundColor:colors, borderWidth:2, borderColor:'#fff' }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'68%',
        plugins:{ legend:{ position:'bottom', labels:{ font:{size:11}, boxWidth:12, padding:12 } },
          tooltip:{ callbacks:{ label:(ctx)=>{ const pct = total ? (ctx.parsed*100/total).toFixed(1) : '0.0'; return `${ctx.label}: ${fmtNum(ctx.parsed)} (${pct}%)`; } } } } },
      plugins:[centerTextPlugin]
    });
  }catch(err){ showChartError(canvasId, err); return null; }
}
function lineChart(canvasId, labels, datasets, opts={}){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return null;
  try{
    return new Chart(canvas.getContext('2d'), {
      type:'line', data:{ labels, datasets: datasets.map(d=>({ label:d.label, data:d.data, borderColor:d.color, backgroundColor:d.color+'22',
        tension:0.35, fill:!!d.fill, pointRadius:3, pointBackgroundColor:d.color, yAxisID:d.yAxisID||'y' })) },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{font:{size:11}, boxWidth:12} } },
        scales: opts.scales || { x:{grid:{display:false}, ticks:{font:{size:10}}}, y:{grid:{color:'#F0F0F5'}, ticks:{font:{size:10}}} } }
    });
  }catch(err){ showChartError(canvasId, err); return null; }
}
function rankingTableCard(title, headers, rows, opts={}){
  const limit = opts.limit || 20;
  const emptyText = opts.emptyText || "Sem dados suficientes para exibir este ranking.";
  if(!rows || !rows.length) return "";
  const body = rows.slice(0,limit).map((r,i)=>{
    const cells = r.map((v,j)=>{ const first = j===0; return `<td>${first && opts.boldFirst ? `<b>${esc(v)}</b>` : v}</td>`; }).join("");
    return `<tr><td style="font-weight:800;color:${i<3?'var(--purple)':'var(--text-muted)'};">${i+1}º</td>${cells}</tr>`;
  }).join("");
  return `<div class="card ${opts.wide ? "card-wide" : ""}"><div class="card-title">${title}</div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>#</th>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${body || `<tr><td colspan="${headers.length+1}" style="color:var(--text-muted)">${emptyText}</td></tr>`}</tbody></table></div></div>`;
}
function simpleTableCard(title, headers, rows){
  if(!rows || !rows.length) return "";
  return `<div class="card"><div class="card-title">${title}</div>
    <div class="table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map((v,j)=>`<td>${j===0?`<b>${esc(v)}</b>`:v}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
}
function renderOverview(){
  const received = getReceivedFiltered();
  const made = getMadeFiltered();
  const chatRows = getChatFiltered();
  const rm = computeReceivedMetrics(received);
  const mm = computeMadeMetrics(made);
  const sat = computeCsat(getSatFiltered());
  const mon = computeMonitoria(getMonFiltered());
  const hasReceived = hasSheetData('received');
  const hasMade = hasSheetData('made');
  const hasChat = hasSheetData('chat');
  const hasSat = hasSheetData('satisfaction');
  const hasMon = hasSheetData('monitoring');
  const hasCanal = hasReceived || hasMade || hasChat;
  const volumeTotal = received.length + made.length + chatRows.length;
  const kpis = [
    kpiCard("Volume total de atendimentos", fmtNum(volumeTotal), `Receptivo ${fmtNum(received.length)} · Ativo ${fmtNum(made.length)} · Chat ${fmtNum(chatRows.length)}`),
    hasReceived ? kpiCard("Nível de serviço", fmtPct(rm.nivelServico/100), "chamadas atendidas em até 20 segundos * 100 / (chamadas atendidas na fila + chamadas abandonadas na fila)", badgeFor(rm.nivelServico/100,0.8)) : "",
    hasReceived ? kpiCard("Taxa de abandono", fmtPct(rm.pctAbandono), "não atendidas / entrantes (receptivo)", badgeFor(1-rm.pctAbandono,0.92)) : "",
    hasSat ? kpiCard("CSAT", fmtPct(sat.csat), `${fmtNum(sat.total)} avaliações · nota média ${fmtNum(sat.media,2)}`, badgeFor(sat.csat,0.85)) : "",
    hasMon ? kpiCard("Nota de monitoria", fmtPct(mon.media), `${fmtNum(mon.total)} monitorias · ${fmtPct(mon.pctMax)} nota máxima`, badgeFor(mon.media,0.85)) : "",
    (hasReceived||hasMade) ? kpiCard("TMA", fmtSec(avg([rm.tma, mm.tma].filter(isFinite))), "receptivo + ativo") : "",
    hasReceived ? kpiCard("TME", fmtSec(rm.tme), "tempo médio de espera (receptivo)") : "",
  ].filter(Boolean);
  const monthMap = new Map(); const weekday = [0,0,0,0,0,0,0]; const setorMap = new Map(); const setorMonthMap = new Map();
  function tally(rows, canalKey){
    for(const r of rows){
      const d = r._date; if(!d) continue;
      const mk = monthKeyISO(d);
      if(!monthMap.has(mk)) monthMap.set(mk, {Receptivo:0,Ativo:0,Chat:0,_date:d});
      monthMap.get(mk)[canalKey]++; weekday[d.getDay()]++;
      const s = r.setor || "—"; setorMap.set(s, (setorMap.get(s)||0)+1);
      if(!setorMonthMap.has(mk)) setorMonthMap.set(mk, new Map());
      const sm = setorMonthMap.get(mk); sm.set(s, (sm.get(s)||0)+1);
    }
  }
  tally(received,"Receptivo"); tally(made,"Ativo"); tally(chatRows,"Chat");
  const months = Array.from(monthMap.keys()).sort();
  const monthLabels = months.map(m=>monthLabelShort(monthMap.get(m)._date));
  const setorLabels = Array.from(setorMap.keys()).sort((a,b)=>setorMap.get(b)-setorMap.get(a));
  const cards = [];
  if(hasCanal && months.length){
    const rows = months.map((m,i)=>{ const x=monthMap.get(m); return [monthLabels[i], fmtNum(x.Receptivo), fmtNum(x.Ativo), fmtNum(x.Chat), `<b>${fmtNum(x.Receptivo+x.Ativo+x.Chat)}</b>`]; });
    cards.push(simpleTableCard("Mix de canais por mês",["Mês","Receptivo","Ativo","Chat","Total"],rows));
  }
  if(hasCanal && weekday.some(v=>v>0)){
    const labels=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    const rows=labels.map((d,i)=>[d,weekday[i]]).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]).map(r=>[r[0],fmtNum(r[1])]);
    cards.push(rankingTableCard("Ranking de volume por dia da semana",["Dia","Atendimentos"],rows,{boldFirst:true}));
  }
  if(hasCanal && setorLabels.length && months.length){
    const rows=setorLabels.map(s=>{
      const vals=months.map(m=>(setorMonthMap.get(m)||new Map()).get(s)||0);
      const total=vals.reduce((a,b)=>a+b,0);
      return [s,...vals.map(v=>fmtNum(v)),`<b>${fmtNum(total)}</b>`,total];
    }).sort((a,b)=>b[b.length-1]-a[a.length-1]).map(r=>r.slice(0,-1));
    cards.push(rankingTableCard("Ranking de atendimentos por setor e mês",["Setor",...monthLabels,"Total"],rows,{boldFirst:true,wide:true}));
  }
  if(hasCanal && setorLabels.length){ cards.push(chartCard("Ranking de volume por setor","chartVolumePorSetor")); }
  if(hasSat){
    const bySatSetor=groupBy(getSatFiltered(),r=>r.setor||"—");
    const hasCsatSetorData = Array.from(bySatSetor.values()).some(rs=>computeCsat(rs).total>0);
    if(hasCsatSetorData) cards.push(chartCard("Ranking de satisfação (CSAT) por setor","chartCsatPorSetor"));
  }
  if(hasCanal){ const channelTotal = received.length+made.length+chatRows.length; if(channelTotal>0) cards.push(chartCard("Ranking de volume por canal","chartCanalDonut",{wide:false})); }
  if(hasSat && sat.dist.some(v=>v>0)){ cards.push(chartCard("Distribuição das notas de satisfação","chartNotaDist",{wide:false})); }
  const evolCards = [];
  if(hasCanal && months.length>1){ evolCards.push(chartCard("Evolução mensal (Volume · CSAT · Nível de Serviço)","chartEvolucaoMensal",{wide:true,height:320})); }
  return `<div class="section-title"><span class="chev">›</span> Indicadores gerais</div><div class="kpi-grid">${kpis.join("")}</div>
  ${evolCards.length ? `<div class="section-title"><span class="chev">›</span> Evolução no período</div><div class="grid-auto">${evolCards.join("")}</div>` : ""}
  ${cards.length ? `<div class="section-title"><span class="chev">›</span> Rankings e comparativos</div><div class="grid-auto">${cards.join("")}</div>` : ""}`;
}
function afterRenderOverview(){
  if(document.getElementById('chartNotaDist')){
    try{
      const sat = computeCsat(getSatFiltered());
      const ranked = sat.dist.map((v,i)=>({nota:i+1, count:v})).filter(r=>r.count>0).sort((a,b)=>b.nota-a.nota);
      const labels = ranked.map(r=>`Nota ${r.nota}`); const data = ranked.map(r=>r.count);
      const NOTA_COLORS = {5:'#5347D1', 4:'#7063F0', 3:'#FFA35C', 2:'#FF7029', 1:'#C2500F'};
      const colors = ranked.map(r=> NOTA_COLORS[r.nota] || '#9CA3AF');
      charts.notaDist = doughnutChart('chartNotaDist', labels, data, colors, { centerText: (total)=>fmtNum(total), centerSub: 'avaliações' });
    }catch(err){ showChartError('chartNotaDist', err); }
  }
  if(document.getElementById('chartVolumePorSetor')){
    try{
      const received=getReceivedFiltered(), made=getMadeFiltered(), chatRows=getChatFiltered();
      const setorMap = new Map();
      [...received,...made,...chatRows].forEach(r=>{ const s = r.setor || "—"; setorMap.set(s, (setorMap.get(s)||0)+1); });
      const ranked = Array.from(setorMap.entries()).sort((a,b)=>b[1]-a[1]).slice(0,20);
      const labels = ranked.map(r=>r[0]); const data = ranked.map(r=>r[1]); const colors = ranked.map((r,i)=>colorForIndex(i));
      charts.volumePorSetor = horizontalBarChart('chartVolumePorSetor', labels, data, colors, { tooltipFmt:(v)=>`${fmtNum(v)} atendimentos` });
    }catch(err){ showChartError('chartVolumePorSetor', err); }
  }
  if(document.getElementById('chartCsatPorSetor')){
    try{
      const bySatSetor=groupBy(getSatFiltered(),r=>r.setor||"—");
      const ranked = Array.from(bySatSetor.entries()).map(([s,rs])=>{ const c = computeCsat(rs); return {setor:s, csat:c.csat, total:c.total}; })
        .filter(r=>isFinite(r.csat) && r.total>0).sort((a,b)=>b.csat-a.csat).slice(0,20);
      const labels = ranked.map(r=>r.setor); const data = ranked.map(r=>+(r.csat*100).toFixed(1)); const colors = ranked.map(r=>riskColor(r.csat, 0.85, 0.70));
      charts.csatPorSetor = horizontalBarChart('chartCsatPorSetor', labels, data, colors, { tooltipFmt:(v,i)=>`CSAT ${v}% · ${fmtNum(ranked[i].total)} avaliações`, xTickFmt:(v)=>v+'%' });
    }catch(err){ showChartError('chartCsatPorSetor', err); }
  }
  if(document.getElementById('chartCanalDonut')){
    try{
      const received=getReceivedFiltered(), made=getMadeFiltered(), chatRows=getChatFiltered();
      const raw = [["Receptivo",received.length,'#7063F0'],["Ativo",made.length,'#FF7029'],["Chat",chatRows.length,'#6B7280']].filter(r=>r[1]>0);
      charts.canalDonut = doughnutChart('chartCanalDonut', raw.map(r=>r[0]), raw.map(r=>r[1]), raw.map(r=>r[2]), { centerText:(total)=>fmtNum(total), centerSub:'atendimentos' });
    }catch(err){ showChartError('chartCanalDonut', err); }
  }
  if(document.getElementById('chartEvolucaoMensal')){
    try{
      const received=getReceivedFiltered(), made=getMadeFiltered(), chatRows=getChatFiltered();
      const sats=getSatFiltered();
      const monthSet = new Set();
      [...received,...made,...chatRows].forEach(r=>{ if(r._date) monthSet.add(monthKeyISO(r._date)); });
      const months = Array.from(monthSet).sort();
      const labels = months.map(m=>{ const [y,mm]=m.split("-"); return MESES_PT[+mm-1]+"/"+y.slice(2); });
      const volumeData = months.map(m=> received.filter(r=>r._date && monthKeyISO(r._date)===m).length + made.filter(r=>r._date && monthKeyISO(r._date)===m).length + chatRows.filter(r=>r._date && monthKeyISO(r._date)===m).length);
      const csatData = months.map(m=>{ const rs = sats.filter(r=>r._date && monthKeyISO(r._date)===m); const c = computeCsat(rs); return isFinite(c.csat) ? +(c.csat*100).toFixed(1) : null; });
      const nsData = months.map(m=>{ const rs = received.filter(r=>r._date && monthKeyISO(r._date)===m); const rm = computeReceivedMetrics(rs); return isFinite(rm.nivelServico) ? +rm.nivelServico.toFixed(1) : null; });
      charts.evolucaoMensal = lineChart('chartEvolucaoMensal', labels, [
        {label:'Volume', data:volumeData, color:'#6B7280', yAxisID:'y'},
        {label:'CSAT (%)', data:csatData, color:'#7063F0', yAxisID:'y1'},
        {label:'Nível de Serviço (%)', data:nsData, color:'#5347D1', yAxisID:'y1'}
      ], { scales:{ x:{ grid:{display:false}, ticks:{font:{size:10}} },
          y:{ position:'left', min:0, grid:{color:'#F0F0F5'}, ticks:{font:{size:10}}, title:{display:true,text:'Volume',font:{size:10}} },
          y1:{ position:'right', grid:{display:false}, ticks:{font:{size:10}}, min:0, max:100, title:{display:true,text:'%',font:{size:10}} } } });
    }catch(err){ showChartError('chartEvolucaoMensal', err); }
  }
}
function renderSector(){
  const setores = state.filters.setor==="all" ? allSetores() : [state.filters.setor];
  const received=getReceivedFiltered(), made=getMadeFiltered(), chatRows=getChatFiltered();
  const sats=getSatFiltered(), mons=getMonFiltered(), pauses=getPauseFiltered();
  const hasReceived=hasSheetData('received'), hasMade=hasSheetData('made'), hasChat=hasSheetData('chat');
  const hasSat=hasSheetData('satisfaction'), hasMon=hasSheetData('monitoring'), hasPause=hasSheetData('pause');
  const hasCanal=hasReceived||hasMade||hasChat;
  const byRecSetor=groupBy(received,r=>r.setor||"—"); const byMadeSetor=groupBy(made,r=>r.setor||"—"); const byChatSetor=groupBy(chatRows,r=>r.setor||"—");
  const bySatSetor=groupBy(sats,r=>r.setor||"—"); const byMonSetor=groupBy(mons,r=>r.setor||"—"); const byPauseSetor=groupBy(pauses,r=>r.setor||"—");
  const rows=setores.map(s=>{
    const rm=computeReceivedMetrics(byRecSetor.get(s)||[]); const mm=computeMadeMetrics(byMadeSetor.get(s)||[]);
    const chatCount=(byChatSetor.get(s)||[]).length; const sat=computeCsat(bySatSetor.get(s)||[]); const mon=computeMonitoria(byMonSetor.get(s)||[]);
    const pauseTotal=sum((byPauseSetor.get(s)||[]).map(r=>r._sec)); const volume=(byRecSetor.get(s)||[]).length+(byMadeSetor.get(s)||[]).length+chatCount;
    return {setor:s,volume,...rm,tmaComb:avg([rm.tma,mm.tma].filter(isFinite)),csat:sat.csat,notaMon:mon.media,pauseTotal};
  }).sort((a,b)=>b.volume-a.volume);
  const columns=[
    {always:true,label:"Setor",render:r=>`<b>${esc(r.setor)}</b>`}, {always:true,label:"Volume",render:r=>fmtNum(r.volume)},
    {show:hasReceived,label:"% Abandono",render:r=>isFinite(r.pctAbandono)?`<span style="color:${riskColor(r.pctAbandono,0.08,0.15,true)};font-weight:700;">${fmtPct(r.pctAbandono)}</span>`:"—"},

  received:     { table: "chamadas_recebidas", columns: { data:"data", agente:"agente", contato:"contato", setor:"setor", status:"status", quemDesligou:"quem_desligou", transferDe:"transfer_de", transferPara:"transfer_para", tempoEspera:"tempo_espera", tempoLigacao:"tempo_ligacao" } },
  made:         { table: "chamadas_realizadas", columns: { data:"data", destino:"destino", agente:"agente", setor:"setor", status:"status", transferPara:"transfer_para", tempoLigacao:"tempo_ligacao" } },
  chat:         { table: "chat", columns: { data:"data", agente:"agente", setor:"setor" } },
  chatPerf:     { table: "chat_performance", columns: { data:"data", agente:"agente", setor:"setor", conversasSat:"conversas_sat", satisfacaoMedia:"satisfacao_media", total:"total", tma:"tma", tmeResp:"tme_resposta" } },
  satisfaction: { table: "satisfacao", columns: { data:"data", agente:"agente", setor:"setor", canal:"canal", nota:"nota" } },
  monitoring:   { table: "monitoria", columns: { data:"data", agente:"agente", setor:"setor", nota:"nota", canal:"canal" } },
  pause:        { table: "pausas", columns: { data:"data", agente:"agente", setor:"setor", tipo:"tipo", duracao:"duracao" } }
};

let loadGeneration = 0;

/* ---------- CACHE LOCAL (IndexedDB) ----------
   Guarda os dados já buscados no navegador de cada pessoa, para que, depois
   da primeira vez, o painel abra na hora (mostrando o que já está salvo) e
   atualize por baixo dos panos, em vez de esperar buscar tudo de novo. */
const IDB_NAME = "agilityCache";
const IDB_STORE = "tables";
function idbOpen(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB indisponível")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,"readonly");
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
  }catch(e){ return undefined; }
}
async function idbSet(key, value){
  try{
    const db = await idbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){ return false; }
}
async function loadFromCacheIfAny(){
  let any = false;
  for(const key of Object.keys(SUPABASE_TABLES)){
    const cached = await idbGet(key);
    if(cached && Array.isArray(cached.rows) && cached.rows.length>0){
      state.raw[key] = cached.rows;
      state.mapping[key] = SUPABASE_TABLES[key].columns;
      normalizeSheet(key);
      any = true;
    }
  }
  return any;
}

async function fetchPageKeysetWithRetry(table, afterId, pageSize, retries){
  let lastError = null;
  for(let attempt=0; attempt<=retries; attempt++){
    try{
      const { data, error } = await supabaseClient.from(table).select("*").gt("id", afterId).order("id", {ascending:true}).limit(pageSize);
      if(error) throw error;
      return data || [];
    }catch(e){
      lastError = e;
      if(attempt < retries) await new Promise(r=>setTimeout(r, 700*(attempt+1)));
    }
  }
  console.warn("Página após id=" + afterId + " de " + table + " falhou após tentativas:", lastError);
  return null; // null indica falha real, mesmo após tentar de novo
}

async function fetchTableAll(table, myGen){
  const pageSize = 1000;
  let all = [];
  let lastId = 0;
  let failedPages = 0;
  while(true){
    if(myGen !== loadGeneration) return { rows: all, failedPages };
    const rows = await fetchPageKeysetWithRetry(table, lastId, pageSize, 2);
    if(rows === null){
      failedPages++;
      break; // para aqui, mas mantém o que já buscou até agora
    }
    if(rows.length === 0) break; // acabou a tabela
    all = all.concat(rows);
    lastId = rows[rows.length-1].id;
    if(rows.length < pageSize) break; // última página (veio incompleta)
  }
  return { rows: all, failedPages };
}

async function loadAllFromSupabase(useLoadingOverlay){
  loadGeneration++;
  const myGen = loadGeneration;
  const problemas = [];
  if(useLoadingOverlay) showLoading("Carregando dados...");
  for(const key of Object.keys(SUPABASE_TABLES)){
    if(myGen !== loadGeneration) return;
    const cfg = SUPABASE_TABLES[key];
    try{
      if(useLoadingOverlay) showLoading("Carregando " + (SHEETS[key]?.label || cfg.table) + "...");
      const { rows, failedPages } = await fetchTableAll(cfg.table, myGen);
      if(myGen !== loadGeneration) return;
      state.raw[key] = rows;
      state.mapping[key] = cfg.columns;
      normalizeSheet(key);
      idbSet(key, { rows, ts: Date.now() });
      if(failedPages > 0){
        problemas.push((SHEETS[key]?.label || cfg.table) + ": " + failedPages + " parte(s) não carregou(aram), tente 'Atualizar dados'.");
      }
    }catch(e){
      console.error("Erro ao buscar " + cfg.table + ":", e);
      problemas.push((SHEETS[key]?.label || cfg.table) + ": " + (e.message || "erro desconhecido"));
    }
  }
  if(useLoadingOverlay) hideLoading();
  if(problemas.length){
    console.warn("Fontes com problema no carregamento:", problemas);
    window._ultimosProblemasCarregamento = problemas;
  }else{
    window._ultimosProblemasCarregamento = null;
  }
}

async function refreshAllData(){
  showSyncIndicator();
  await loadAllFromSupabase(false);
  normalizeAllSheets();
  renderScreen();
  updateSidebarStatus();
  hideSyncIndicator();
}

async function carregarPerfilUsuario(userId){
  const { data, error } = await supabaseClient.from("perfis").select("*").eq("id", userId).single();
  if(error){ console.warn("Perfil não encontrado:", error.message); return null; }
  return data;
}

function mostrarLogin(msgErro){
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("app").style.visibility = "hidden";
  if(msgErro) document.getElementById("loginError").textContent = msgErro;
}
function esconderLogin(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.visibility = "visible";
}

async function fazerLogin(){
  const email = document.getElementById("loginEmail").value.trim();
  const senha = document.getElementById("loginPassword").value;
  document.getElementById("loginError").textContent = "";
  if(!email || !senha){
    document.getElementById("loginError").textContent = "Preencha e-mail e senha.";
    return;
  }
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if(error){
    document.getElementById("loginError").textContent = "E-mail ou senha inválidos.";
    return;
  }
  await iniciarAppLogado(data.user);
}

async function iniciarAppLogado(user){
  esconderLogin();
  const perfil = await carregarPerfilUsuario(user.id);
  adicionarBotaoSair(perfil);

  const hasCache = await loadFromCacheIfAny();

  if(hasCache){
    // Já tem dados salvos neste navegador: mostra na hora, sem tela de carregamento.
    normalizeAllSheets();
    renderNav();
    goToScreen("overview");
    updateSidebarStatus();
    // Atualiza por baixo dos panos, sem travar a tela.
    showSyncIndicator();
    loadAllFromSupabase(false).then(()=>{
      normalizeAllSheets();
      renderScreen();
      updateSidebarStatus();
      hideSyncIndicator();
    });
  }else{
    // Primeira vez neste navegador: precisa buscar tudo, mostra a tela de carregamento.
    await loadAllFromSupabase(true);
    normalizeAllSheets();
    renderNav();
    goToScreen("overview");
    updateSidebarStatus();
  }
}

function adicionarBotaoSair(perfil){
  const footer = document.querySelector(".sidebar-footer");
  if(!footer || document.getElementById("btnLogout")) return;
  const nome = (perfil && perfil.nome) || "Usuário";
  const setor = perfil && perfil.is_admin ? "Acesso total (admin)" : ((perfil && perfil.setor) || "Sem setor definido");
  const info = document.createElement("div");
  info.className = "login-user-info";
  info.innerHTML = `<b>${esc(nome)}</b><br>${esc(setor)}`;
  const btn = document.createElement("button");
  btn.id = "btnLogout";
  btn.className = "btn btn-ghost btn-sm";
  btn.style.cssText = "margin-top:8px;width:100%;";
  btn.textContent = "Sair";
  btn.addEventListener("click", async ()=>{
    await supabaseClient.auth.signOut();
    location.reload();
  });
  footer.appendChild(info);
  footer.appendChild(btn);
}

async function iniciarComAutenticacao(){
  renderNav();
  document.getElementById("menuToggle")?.addEventListener("click", ()=>{
    document.getElementById("sidebar").classList.toggle("open");
  });
  document.getElementById("btnCancelLoad")?.addEventListener("click", cancelLoading);
  document.getElementById("btnLogin").addEventListener("click", fazerLogin);
  document.getElementById("loginPassword").addEventListener("keydown", e=>{ if(e.key==="Enter") fazerLogin(); });
  document.getElementById("loginEmail").addEventListener("keydown", e=>{ if(e.key==="Enter") fazerLogin(); });

  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session && session.user){
    await iniciarAppLogado(session.user);
  }else{
    mostrarLogin();
  }
}

window.addEventListener("DOMContentLoaded", iniciarComAutenticacao);
</script>
