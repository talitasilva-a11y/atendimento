<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agility Insights — Painel de Atendimento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --purple:#7063F0;
  --purple-dark:#5347d1;
  --purple-light:#EEEBFF;
  --orange:#FF7029;
  --orange-light:#FFE9DD;
  --dark:#1C1F26;
  --dark-2:#262A33;
  --dark-3:#333846;
  --bg:#F5F6FA;
  --card:#FFFFFF;
  --text:#1C1F26;
  --text-muted:#6B7280;
  --border:#E7E8EF;
  --gold:#F5A623;
  --silver:#9CA3AF;
  --bronze:#C97B4A;
  --green:#22C55E;
  --red:#EF4444;
  --radius:14px;
  --shadow:0 2px 10px rgba(28,31,38,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Sora',sans-serif;margin:0;letter-spacing:-0.01em;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D8D9E4;border-radius:8px;}
button{font-family:inherit;cursor:pointer;}
a{color:var(--purple);text-decoration:none;}
table{border-collapse:collapse;width:100%;}
input,select{font-family:inherit;}

/* ---------- LAYOUT ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:230px;flex:none;background:var(--dark);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.sidebar-logo{
  padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08);
}
.sidebar-logo img{width:150px;display:block;}
.nav{flex:1;padding:14px 10px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;margin-bottom:2px;border-radius:10px;
  color:#B7BAC6;font-size:13.5px;font-weight:500;
  cursor:pointer;position:relative;transition:background .15s,color .15s;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--purple);color:#fff;}
.nav-item.active::before{
  content:"›";position:absolute;left:-2px;top:50%;transform:translateY(-50%);
  color:var(--orange);font-size:18px;font-weight:800;font-family:'Sora',sans-serif;
  display:none;
}
.nav-icon{width:17px;height:17px;flex:none;display:flex;align-items:center;justify-content:center;}
.nav-icon svg{width:100%;height:100%;}
.nav-section-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:#5C6070;
  padding:16px 14px 6px;font-weight:700;
}
.sidebar-footer{padding:14px;border-top:1px solid rgba(255,255,255,0.08);}
.status-pill{
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8B8F9E;padding:6px 8px;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;}
.status-dot.off{background:#5C6070;}
.status-dot.warn{background:var(--orange);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;position:sticky;top:0;z-index:20;flex-wrap:wrap;
}
.topbar-title{display:flex;align-items:center;gap:10px;}
.topbar-title .chevron{color:var(--orange);font-family:'Sora',sans-serif;font-weight:800;font-size:20px;}
.topbar-title h1{font-size:19px;}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.filter-select{
  border:1px solid var(--border);background:var(--bg);border-radius:9px;
  padding:8px 10px;font-size:12.5px;color:var(--text);min-width:110px;
}
.btn{
  border:none;border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:var(--purple);color:#fff;}
.btn-primary:hover{background:var(--purple-dark);}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{background:#ECEDF3;}
.btn-sm{padding:6px 10px;font-size:11.5px;}

.content{padding:24px 28px 60px;flex:1;}
.screen{display:none;}
.screen.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.section-title{
  display:flex;align-items:center;gap:8px;margin:28px 0 14px;font-size:15px;font-weight:700;color:var(--text);
}
.section-title:first-child{margin-top:0;}
.section-title .chev{color:var(--orange);font-weight:800;font-family:'Sora',sans-serif;}

/* ---------- KPI CARDS ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
.kpi-card{
  background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.kpi-label{font-size:11.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.kpi-value{font-family:'Sora',sans-serif;font-size:26px;font-weight:700;color:var(--text);}
.kpi-sub{font-size:11.5px;color:var(--text-muted);margin-top:4px;}
.kpi-badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;}
.badge-good{background:#DFF7E6;color:#15803D;}
.badge-bad{background:#FDE4E4;color:#B91C1C;}
.badge-neutral{background:var(--purple-light);color:var(--purple-dark);}

.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;}
.grid-auto .card-wide{grid-column:1 / -1;}
@media(max-width:1000px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.card{
  background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.card-title{font-size:13.5px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.card-title small{color:var(--text-muted);font-weight:500;font-size:11.5px;}
.chart-wrap{position:relative;height:260px;}
.chart-wrap.tall{height:320px;}

/* ---------- TABLES ---------- */
.table-wrap{overflow-x:auto;}
table.data-table{font-size:12.5px;}
table.data-table th{
  text-align:left;padding:9px 12px;color:var(--text-muted);font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border);white-space:nowrap;
  cursor:pointer;user-select:none;
}
table.data-table th:hover{color:var(--purple);}
table.data-table td{padding:9px 12px;border-bottom:1px solid #F0F0F5;white-space:nowrap;}
table.data-table tbody tr:hover{background:#FAFAFD;}
.pill{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;}
.pill-green{background:#DFF7E6;color:#15803D;}
.pill-orange{background:var(--orange-light);color:#C1440E;}
.pill-red{background:#FDE4E4;color:#B91C1C;}
.pill-purple{background:var(--purple-light);color:var(--purple-dark);}
.pill-gray{background:#EEF0F4;color:var(--text-muted);}

/* ---------- RANKING (gamificado) ---------- */
.ranking-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--card);padding:6px;border-radius:14px;
  border:1px solid var(--border);width:fit-content;box-shadow:var(--shadow);flex-wrap:wrap;}
.rtab{
  display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:none;background:transparent;
  font-size:12.5px;font-weight:600;color:var(--text-muted);
}
.rtab svg{width:15px;height:15px;}
.rtab.active{background:var(--purple);color:#fff;}
.rank-list{display:flex;flex-direction:column;gap:10px;}
.rank-row{
  display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 18px;box-shadow:var(--shadow);
}
.rank-pos{
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-weight:800;font-size:13px;color:#fff;background:#C9CBD6;flex:none;
}
.rank-row.top1 .rank-pos{background:linear-gradient(135deg,#FFD65C,#F5A623);}
.rank-row.top2 .rank-pos{background:linear-gradient(135deg,#C9CDD6,#9CA3AF);}
.rank-row.top3 .rank-pos{background:linear-gradient(135deg,#E0A277,#C97B4A);}
.rank-avatar{
  width:42px;height:42px;border-radius:50%;background:var(--purple-light);color:var(--purple-dark);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;
  font-family:'Sora',sans-serif;
}
.rank-info{flex:1;min-width:0;}
.rank-name{font-weight:700;font-size:13.5px;color:var(--text);}
.rank-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.rank-score{text-align:right;flex:none;}
.rank-score .val{font-family:'Sora',sans-serif;font-weight:800;font-size:16px;}
.rank-badge{
  font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:3px;display:inline-block;
}
.rank-row.top1 .rank-badge{background:#FFF3D6;color:#8A5A00;}
.rank-row.top2 .rank-badge{background:#F1F2F5;color:#565C6B;}
.rank-row.top3 .rank-badge{background:#FBE7DB;color:#8A3E12;}
.rank-row:not(.top1):not(.top2):not(.top3) .rank-badge{background:var(--purple-light);color:var(--purple-dark);}

/* ---------- CONFIG SCREEN ---------- */
.config-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
.config-block h3{font-size:14.5px;margin-bottom:4px;}
.config-block p.hint{color:var(--text-muted);font-size:12px;margin:4px 0 14px;line-height:1.5;}
.config-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.config-row input[type=text]{
  flex:1;min-width:260px;border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:12.5px;
}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px;}
.map-field{display:flex;flex-direction:column;gap:4px;}
.map-field label{font-size:11.5px;color:var(--text-muted);font-weight:600;}
.map-field select{border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12px;}
.map-field.optional label::after{content:" (opcional)";color:#B6B9C4;font-weight:400;}
.sheet-status{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
.sheet-status.ok{background:#DFF7E6;color:#15803D;}
.sheet-status.err{background:#FDE4E4;color:#B91C1C;}
.sheet-status.empty{background:#EEF0F4;color:var(--text-muted);}
.textarea-fallback{width:100%;min-height:90px;border:1px solid var(--border);border-radius:9px;padding:10px;font-size:11.5px;font-family:monospace;margin-top:8px;display:none;}
.note-box{
  background:var(--purple-light);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--purple-dark);
  line-height:1.5;margin-top:8px;
}
.note-box.warn{background:var(--orange-light);color:#8A3E12;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state svg{width:52px;height:52px;margin-bottom:14px;opacity:.5;}
.empty-state h3{color:var(--text);margin-bottom:6px;}
.empty-state .btn{margin-top:16px;}

.loading-overlay{position:fixed;inset:0;background:rgba(28,31,38,0.4);display:none;align-items:center;justify-content:center;z-index:100;}
.loading-box{background:#fff;padding:24px 34px;border-radius:14px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:12px;}
.spinner{width:18px;height:18px;border:3px solid var(--purple-light);border-top-color:var(--purple);border-radius:50%;animation:spin 0.7s linear infinite;}
.sync-indicator{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-muted);font-weight:500;margin-left:4px;}
.spinner-sm{width:11px;height:11px;border:2px solid var(--purple-light);border-top-color:var(--purple);border-radius:50%;animation:spin 0.7s linear infinite;flex:none;}
@keyframes spin{to{transform:rotate(360deg);}}

.legend-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--text-muted);}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}

@media(max-width:900px){
  .sidebar{position:fixed;left:-230px;transition:left .2s;z-index:50;}
  .sidebar.open{left:0;}
  .content{padding:18px 14px;}
  .topbar{padding:12px 14px;}
}
.menu-toggle{display:none;background:none;border:none;padding:6px;}
.menu-toggle svg{width:22px;height:22px;}
@media(max-width:900px){.menu-toggle{display:flex;}}
</style>
</head>

  {match:["feedback"], limitSec:60*60, alertOnly:true},
  {match:["reuni"], limitSec:60*60, alertOnly:true},
];
function pauseLimitSecFor(tipoRaw, setorRaw){
  const tipo = (tipoRaw||"").toLowerCase();
  const setor = (setorRaw||"").toLowerCase();
  for(const p of PAUSE_TYPE_RULES){
    if(p.match.some(m=>tipo.includes(m))){
      if(p.dependsOnSetor){
        const isCAR = setor.includes("conta") && setor.includes("receber");
        return isCAR ? 15*60 : 10*60;
      }
      return p.limitSec;
    }
  }
  return null;
}
function pauseIsAlertOnly(tipoRaw){
  const tipo = (tipoRaw||"").toLowerCase();
  const rule = PAUSE_TYPE_RULES.find(p=>p.match.some(m=>tipo.includes(m)));
  return rule ? !!rule.alertOnly : false;
}

function autoGuessMapping(sheetKey, headers){
  const map = {};
  const lowerHeaders = headers.map(h=>({raw:h, norm:String(h).trim().toLowerCase()}));
  SHEETS[sheetKey].fields.forEach(f=>{
    const guesses = HEADER_GUESSES[f.key] || [];
    for(const g of guesses){
      const found = lowerHeaders.find(h=>h.norm===g);
      if(found){ map[f.key] = found.raw; return; }
    }
  });
  return map;

/* ---------- STORAGE ----------
   Este arquivo pode ser aberto de dois jeitos: dentro do Claude (onde existe
   window.storage) ou como um site normal, por exemplo hospedado no GitHub
   Pages (onde window.storage NÃO existe). Detectamos qual ambiente está
   disponível e usamos localStorage como alternativa — assim a configuração
   nunca se perde só porque foi aberta fora do Claude. */
const HAS_ARTIFACT_STORAGE = (typeof window!=="undefined") && !!window.storage && typeof window.storage.get==="function";
async function storageGetRaw(key){
  if(HAS_ARTIFACT_STORAGE){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; }
  }
  try{ return window.localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSetRaw(key, value){
  if(HAS_ARTIFACT_STORAGE){
    try{ await window.storage.set(key, value, false); return true; }catch(e){ return false; }
  }
  try{ window.localStorage.setItem(key, value); return true; }catch(e){ return false; }
}

let state = {
  urls: {},
  mapping: {},
  headers: {},
  raw: {},
  rows: {},
  filters: { period: "all", setor: "all", agente: "all", canal: "all" }
};

async function saveConfig(){
  await storageSetRaw('agility_config', JSON.stringify({urls:state.urls, mapping:state.mapping}));
}
async function loadConfig(){
  try{
    const value = await storageGetRaw('agility_config');
    if(value){
      const parsed = JSON.parse(value);
      state.urls = parsed.urls || {};
      state.mapping = parsed.mapping || {};
    }
  }catch(e){ /* sem config ainda */ }
  // Preenche com os links/mapeamento padrão embutidos no código (DEFAULT_URLS/DEFAULT_MAPPING)
  // para tudo que este navegador ainda não tiver — é o que permite que qualquer pessoa,
  // mesmo sem nunca ter configurado nada, já busque os dados ao vivo da planilha.
  Object.keys(SHEETS).forEach(key=>{
    if(!state.urls[key] && DEFAULT_URLS[key]) state.urls[key] = DEFAULT_URLS[key];
    if((!state.mapping[key] || Object.keys(state.mapping[key]).length===0) && DEFAULT_MAPPING[key] && Object.keys(DEFAULT_MAPPING[key]).length>0){
      state.mapping[key] = DEFAULT_MAPPING[key];
    }
  });
}

/* ---------- PERSISTÊNCIA DOS DADOS JÁ CARREGADOS ----------
   Além dos links e do mapeamento, agora também guardamos os dados já
   buscados de cada aba (state.raw/state.headers) no navegador, para que
   ao apertar F5 (ou reabrir o site no GitHub Pages) os números continuem
   aparecendo sem precisar clicar em "Carregar" de novo.

   Isso usa o mesmo localStorage (ou window.storage dentro do Claude), que
   tem um limite total de alguns MB por site. Por isso, cada aba só é salva
   se o tamanho dela (em JSON) estiver dentro de RAW_STORAGE_MAX_BYTES —
   abas muito grandes (ex.: Chamadas Realizadas com 190k+ linhas) podem não
   caber e, nesse caso, seguem precisando ser recarregadas manualmente após
   o F5. O painel avisa quando isso acontece. */
const RAW_STORAGE_PREFIX = 'agility_raw_';
const RAW_STORAGE_MAX_BYTES = 3.5 * 1024 * 1024; // ~3.5MB por aba, deixando margem no limite total do navegador
let rawPersistFailed = {}; // key -> true quando a aba era grande/não coube no storage

async function saveRawData(key){
  try{
    const rows = state.raw[key] || [];
    if(rows.length===0) return true;
    const payload = JSON.stringify({headers: state.headers[key]||[], rows});
    if(payload.length > RAW_STORAGE_MAX_BYTES){
      rawPersistFailed[key] = true;
      return false;
    }
    const ok = await storageSetRaw(RAW_STORAGE_PREFIX+key, payload);
    rawPersistFailed[key] = !ok;
    return ok;
  }catch(e){
    rawPersistFailed[key] = true;
    return false;
  }
}
async function loadRawData(key){
  try{
    const value = await storageGetRaw(RAW_STORAGE_PREFIX+key);
    if(!value) return false;
    const parsed = JSON.parse(value);
    state.headers[key] = parsed.headers || [];
    state.raw[key] = parsed.rows || [];
    return true;
  }catch(e){ return false; }
}
async function saveAllRawData(){
  for(const key of Object.keys(SHEETS)) await saveRawData(key);
}
async function loadAllRawData(){
  for(const key of Object.keys(SHEETS)) await loadRawData(key);
}

/* ---------- DADOS PUBLICADOS (snapshot estático para qualquer navegador) ----------
   localStorage só existe no navegador de quem carregou os dados. Para quem só
   vai VISUALIZAR o painel (ex.: enviar o link para o diretor), isso não é
   suficiente — em outro navegador/computador o painel apareceria vazio.

   A solução: depois de carregar os dados, o dono do painel clica em "Gerar
   arquivo de dados para publicar", baixa o arquivo agility-data.json, e sobe
   esse arquivo na MESMA pasta do index.html no repositório do GitHub (mesmo
   nome de arquivo). A partir daí, toda vez que o site é aberto — em qualquer
   navegador — ele busca esse arquivo (é um arquivo estático do próprio site,
   sem CORS e sem depender de armazenamento do navegador) e já mostra os
   dados prontos, sem precisar clicar em nada.

   Isso é uma FOTO dos dados no momento em que o arquivo foi gerado — para
   atualizar, quem administra o painel carrega os dados novos e gera/publica
   um novo agility-data.json. */
const PUBLISHED_SNAPSHOT_FILENAME = 'agility-data.json';
let usingPublishedSnapshot = false;
let publishedSnapshotAt = null;

function exportPublishedSnapshot(){
  const data = {};
  let anyData = false;
  Object.keys(SHEETS).forEach(key=>{
    if(state.raw[key] && state.raw[key].length>0){
      data[key] = { headers: state.headers[key]||[], rows: state.raw[key] };
      anyData = true;
    }
  });
  if(!anyData){
    alert('Carregue ao menos uma fonte de dados antes de gerar o arquivo para publicar.');
    return;
  }
  const payload = {
    generatedAt: new Date().toISOString(),
    urls: state.urls,
    mapping: state.mapping,
    data
  };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = PUBLISHED_SNAPSHOT_FILENAME;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function loadPublishedSnapshotIfNeeded(){
  const anyMissing = Object.keys(SHEETS).some(k=>!(state.raw[k] && state.raw[k].length>0));
  if(!anyMissing) return; // já tem tudo (ex.: veio do localStorage de quem administra) — não precisa do snapshot
  try{
    const res = await fetch('./'+PUBLISHED_SNAPSHOT_FILENAME, {cache:'no-store'});
    if(!res.ok) return; // arquivo ainda não foi publicado — segue normalmente para a tela de Configuração
    const snap = await res.json();
    let usedAny = false;
    Object.keys(SHEETS).forEach(key=>{
      const already = state.raw[key] && state.raw[key].length>0;
      const fromSnap = snap.data && snap.data[key];
      if(!already && fromSnap){
        state.raw[key] = fromSnap.rows || [];
        state.headers[key] = fromSnap.headers || [];
        if(!state.urls[key] && snap.urls && snap.urls[key]) state.urls[key] = snap.urls[key];
        if((!state.mapping[key] || Object.keys(state.mapping[key]).length===0) && snap.mapping && snap.mapping[key]){
          state.mapping[key] = snap.mapping[key];
        }
        usedAny = true;
      }
    });
    if(usedAny){
      usingPublishedSnapshot = true;
      publishedSnapshotAt = snap.generatedAt || null;
    }
  }catch(e){ /* sem arquivo publicado, ou fetch bloqueado — segue sem ele */ }
}

/* ---------- AUTO-ATUALIZAÇÃO AO VIVO ----------
   Sempre que a página é aberta (ou recarregada com F5), o painel tenta buscar
   a versão mais recente de cada aba direto da planilha (usando os links salvos
   neste navegador OU os links padrão embutidos no código — DEFAULT_URLS).

   - Se já existem dados em cache neste navegador: eles aparecem IMEDIATAMENTE
     (tela nunca fica vazia), e a busca ao vivo roda por baixo dos panos —
     só quando terminar com sucesso é que os números são atualizados na tela.
   - Se uma aba falhar ao buscar (sem internet, link quebrado, CORS), os dados
     que já estavam em cache continuam sendo exibidos normalmente — nada some.
   - Se este navegador nunca carregou nada antes (ex.: primeira vez que o
     diretor abre o link), aí sim mostramos a tela de carregamento (com botão
     Cancelar) enquanto busca pela primeira vez. */
function showSyncIndicator(){
  const el = document.getElementById('syncIndicator');
  if(el) el.style.display = 'inline-flex';
}
function hideSyncIndicator(){
  const el = document.getElementById('syncIndicator');
  if(el) el.style.display = 'none';
}
async function backgroundAutoRefresh(){
  loadGeneration++;
  const myGen = loadGeneration;
  const keys = Object.keys(SHEETS).filter(k=>(state.urls[k]||'').trim());
  if(keys.length===0) return;
  showSyncIndicator();
  for(const key of keys){
    if(myGen!==loadGeneration){ hideSyncIndicator(); return; }
    const res = await fetchSheet(key, ()=>{});
    if(myGen!==loadGeneration){ hideSyncIndicator(); return; }
    if(res.ok){
      normalizeSheetIfMapped(key);
      await saveRawData(key);
      renderScreen();
      updateSidebarStatus();
    }
    // se falhar (offline, CORS, timeout), mantemos o que já estava em cache — nada é apagado
  }
  saveConfig();
  hideSyncIndicator();
}
async function foregroundAutoRefresh(){
  loadGeneration++;
  const myGen = loadGeneration;
  const keys = Object.keys(SHEETS).filter(k=>(state.urls[k]||'').trim());
  if(keys.length===0) return false;
  let gotAny = false;
  for(const key of keys){
    if(myGen!==loadGeneration) return gotAny;
    showLoading(`Carregando ${SHEETS[key].label}...`);
    const res = await fetchSheet(key, count=>{
      if(myGen!==loadGeneration) return;
      showLoading(`Carregando ${SHEETS[key].label}... ${count.toLocaleString('pt-BR')} linhas`);
    });
    if(myGen!==loadGeneration) return gotAny;
    if(res.ok){ normalizeSheetIfMapped(key); await saveRawData(key); gotAny = true; }
  }
  saveConfig();
  hideLoading();
  return gotAny;
}

/* ---------- GERAR CÓDIGO COM OS LINKS/MAPEAMENTO PADRÃO DO SITE ---------- */
function buildDefaultsCode(){

    mapObj[key] = state.mapping[key] || {};
  });

}

    return;

/* ---------- CSV LOADING ----------
   Abas grandes (ex.: Chamadas Realizadas, com 190k+ linhas) travavam a aba do
   navegador porque o fetch()+parse rodava inteiro e de forma síncrona na thread
   principal. Agora usamos o modo streaming do PapaParse (download + worker),
   que baixa e interpreta o CSV em um Web Worker, em pedaços (chunks), e libera
   a thread principal entre cada pedaço — a tela continua respondendo e mostra
   o progresso em tempo real.

   Além disso: cada carregamento tem um "número de geração" (loadGeneration).
   Isso permite cancelar um carregamento travado (botão "Cancelar" no overlay)
   sem precisar recarregar a página inteira — e sem perder os links salvos.
   Cada carregamento também tem um tempo-limite automático, para nunca ficar
   preso indefinidamente numa aba que não responde. */
let loadGeneration = 0;
const FETCH_TIMEOUT_MS = 150000; // 2m30s por aba antes de desistir automaticamente

function parseCsvText(text){
  const res = Papa.parse(text, {header:true, skipEmptyLines:true, dynamicTyping:false});
  return {rows: res.data, headers: res.meta.fields || []};
}
function buildCsvFetchUrl(url){
  let fetchUrl = url;
  const m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(m && !/output=csv|\/pub\?/.test(url)){
    const gidMatch = url.match(/gid=([0-9]+)/);
    const gid = gidMatch ? gidMatch[1] : "0";
    fetchUrl = `https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv&gid=${gid}`;
  }
  return fetchUrl;
}
function fetchSheet(key, onProgress){
  const myGen = loadGeneration;
  const url = (state.urls[key]||"").trim();
  if(!url) return Promise.resolve({ok:false, reason:"no_url"});
  const fetchUrl = buildCsvFetchUrl(url);
  return new Promise(resolve=>{
    const rows = [];
    let headers = [];
    let gotAny = false;
    let settled = false;
    const finish = (result)=>{ if(settled) return; settled = true; clearTimeout(timer); resolve(result); };
    const timer = setTimeout(()=>{ finish({ok:false, reason:"timeout"}); }, FETCH_TIMEOUT_MS);
    Papa.parse(fetchUrl, {
      download: true,
      worker: true,
      header: true,
      skipEmptyLines: true,
      chunk: function(results){
        if(myGen!==loadGeneration) return; // cancelado nesse meio tempo — ignora o resto
        gotAny = true;
        if(!headers.length) headers = results.meta.fields || [];
        for(const r of results.data) rows.push(r);
        if(onProgress) onProgress(rows.length);
      },
      complete: function(){
        if(myGen!==loadGeneration){ finish({ok:false, reason:"cancelled"}); return; }
        if(!gotAny){ finish({ok:false, reason:"empty_or_cors"}); return; }
        state.raw[key] = rows;
        state.headers[key] = headers;
        if(!state.mapping[key] || Object.keys(state.mapping[key]).length===0){
          state.mapping[key] = autoGuessMapping(key, headers);
        }
        finish({ok:true, rows: rows.length});
      },
      error: function(err){
        finish({ok:false, reason:"fetch_error", error: err && err.message});
      }
    });
  });
}
function loadPastedCsv(key, text){
  const {rows, headers} = parseCsvText(text);
  state.raw[key] = rows;
  state.headers[key] = headers;
  if(!state.mapping[key] || Object.keys(state.mapping[key]).length===0){
    state.mapping[key] = autoGuessMapping(key, headers);
  }
}

/* ---------- HELPERS DE PARSING ---------- */
function toNumber(v){
  if(v===undefined||v===null||v==="") return NaN;
  if(typeof v==="number") return v;
  const raw = String(v).trim();
  if(raw==="-"||raw==="") return NaN;
  if(/^-?\d+(\.\d+)?$/.test(raw)) return parseFloat(raw);
  if(/^-?\d{1,3}(\.\d{3})*(,\d+)?$/.test(raw)) return parseFloat(raw.replace(/\./g,"").replace(",","."));
  if(/^-?\d+,\d+$/.test(raw)) return parseFloat(raw.replace(",","."));
  const f = parseFloat(raw);
  return isNaN(f)?NaN:f;
}
function parseDateFlexible(v){
  if(!v) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    let [_, d, mo, y, h, mi, se] = m;
    if(y.length===2) y = "20"+y;
    return new Date(+y, +mo-1, +d, +(h||0), +(mi||0), +(se||0));
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    let [_, y, mo, d, h, mi, se] = m;
    return new Date(+y, +mo-1, +d, +(h||0), +(mi||0), +(se||0));
  }
  const dd = new Date(s);
  return isNaN(dd.getTime()) ? null : dd;
}
function durationToSeconds(v){
  if(v===undefined||v===null||v==="") return NaN;
  const s = String(v).trim();
  if(s==="-") return NaN;
  if(/^\d{1,3}:\d{2}:\d{2}(\.\d+)?$/.test(s)){
    const [h,m,sec] = s.split(":");
    return (+h)*3600+(+m)*60+parseFloat(sec);
  }
  if(/^\d{1,3}:\d{2}$/.test(s)){
    const [m,sec] = s.split(":").map(Number);
    return m*60+sec;
  }
  return toNumber(s);
}
function normalizeStatus(v){
  const s = (v||"").toString().toLowerCase();
  if(s.includes("n\u00e3o")||s.includes("nao")) return "NaoAtendida";
  if(s.includes("aband")) return "NaoAtendida";
  if(s.includes("atend")) return "Atendida";
  return v || "Atendida";
}
function isTransfer(v){
  const s = (v||"").toString().trim();
  return s!=="" && s!=="-";
}
function normalizeFraction(v){
  // Normaliza uma nota que pode estar em escala 0–1 OU já em escala 0–100 (ex.: monitoria)
  if(!isFinite(v)) return v;
  return v>1 ? v/100 : v;
}

/* ---------- NORMALIZAÇÃO ----------
   Além de mapear as colunas, já pré-calculamos aqui os campos derivados
   (_date, _status, valores numéricos etc.) UMA VEZ no carregamento — em vez
   de recalcular isso a cada troca de tela/filtro. Para a aba de Chamadas
   Realizadas (190k+ linhas) isso é o que evita a tela travar toda vez que o
   usuário navega ou muda um filtro. */
const SHEET_ENRICHERS = {
  received: r=>{ r._date=parseDateFlexible(r.data); r._status=normalizeStatus(r.status); r._esp=toNumber(r.tempoEspera); r._dur=toNumber(r.tempoLigacao); },
  made: r=>{ r._date=parseDateFlexible(r.data); r._status=normalizeStatus(r.status); r._dur=toNumber(r.tempoLigacao); },
  chat: r=>{ r._date=parseDateFlexible(r.data); },
  chatPerf: r=>{ r._date=parseDateFlexible(r.data); r._total=toNumber(r.total); r._tma=durationToSeconds(r.tma); r._tmeResp=durationToSeconds(r.tmeResp); r._satMedia=toNumber(r.satisfacaoMedia); r._conversasSat=toNumber(r.conversasSat); },
  satisfaction: r=>{ r._date=parseDateFlexible(r.data); r._nota=toNumber(r.nota); },
  // a nota de monitoria pode vir na planilha como fração (0–1) OU já como percentual (0–100) —
  // normalizamos sempre para fração 0–1 aqui, uma única vez, para não gerar ranking com "9827%".
  monitoring: r=>{ r._date=parseDateFlexible(r.data); r._nota=normalizeFraction(toNumber(r.nota)); },
  pause: r=>{ r._date=parseDateFlexible(r.data); r._sec=toNumber(r.duracao); },
};
function normalizeSheet(key){
  const map = state.mapping[key] || {};
  const rawRows = state.raw[key] || [];
  const enrich = SHEET_ENRICHERS[key];
  const out = new Array(rawRows.length);
  for(let i=0;i<rawRows.length;i++){
    const r = rawRows[i];
    const o = {};
    for(const f of SHEETS[key].fields){
      const header = map[f.key];
      o[f.key] = header ? r[header] : undefined;
    }
    if(enrich) enrich(o);
    out[i] = o;
  }
  state.rows[key] = out;
  return out;
}
function normalizeAllSheets(){
  Object.keys(SHEETS).forEach(k=>{ if(state.raw[k]) normalizeSheet(k); });
}
/* ============================================================
   MOTOR DE CÁLCULO
   ============================================================ */

function fmtPct(v){ return isFinite(v) ? (v*100).toFixed(1).replace(".",",")+"%" : "—"; }
function fmtNum(v,d=0){ return isFinite(v) ? v.toLocaleString('pt-BR',{maximumFractionDigits:d, minimumFractionDigits:d}) : "—"; }
function fmtSec(v){
  if(!isFinite(v)) return "—";
  v = Math.round(v);
  const h = Math.floor(v/3600), m = Math.floor((v%3600)/60), s = v%60;
  if(h>0) return `${h}h ${String(m).padStart(2,'0')}m`;
  return `${m}m ${String(s).padStart(2,'0')}s`;
}
function avg(arr){ const v = arr.filter(x=>isFinite(x)); return v.length? v.reduce((a,b)=>a+b,0)/v.length : NaN; }
function sum(arr){ const v = arr.filter(x=>isFinite(x)); return v.length? v.reduce((a,b)=>a+b,0) : 0; }
function groupBy(rows, keyFn){
  const m = new Map();
  rows.forEach(r=>{ const k = keyFn(r); if(!m.has(k)) m.set(k, []); m.get(k).push(r); });
  return m;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function monthKey(d){ return d.toLocaleDateString('pt-BR', {month:'2-digit', year:'numeric'}); }
const MESES_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_PT_LONG = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function monthKeyISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabelShort(d){ return MESES_PT[d.getMonth()]+"/"+String(d.getFullYear()).slice(2); }
function monthLabelFromISO(iso){ const [y,m] = iso.split("-"); return MESES_PT_LONG[+m-1]+" "+y; }

// Filtro de período: por mês exato (ex.: "2026-03") ou "all" para todo o período
function inPeriod(date){
  const p = state.filters.period;
  if(p==="all") return true;
  if(!date) return false;
  return monthKeyISO(date)===p;
}
function allMonthsAvailable(){
  const set = new Set();
  ["received","made","chat","satisfaction","monitoring","pause"].forEach(k=>{
    (state.rows[k]||[]).forEach(r=>{ if(r._date) set.add(monthKeyISO(r._date)); });
  });
  return Array.from(set).sort();
}

function passesFilters(row, {setor=true, agente=true}={}){
  const f = state.filters;
  if(setor && f.setor!=="all" && (row.setor||"—")!==f.setor) return false;
  if(agente && f.agente!=="all" && (row.agente||"—")!==f.agente) return false;
  return true;
}
// canal filter só é aplicável a fontes onde o canal é o próprio conjunto de dados (recebidas/realizadas/chat)
function canalAllows(canalName){
  const f = state.filters.canal;
  return f==="all" || f===canalName;
}
// satisfação/monitoria usam vocabulário próprio de canal (Telefonia/Chat/instagram) — melhor esforço
function satCanalMatches(rawCanal){
  const f = state.filters.canal;
  if(f==="all") return true;
  const c = (rawCanal||"").toLowerCase();
  if(f==="Chat") return c.includes("chat");
  return c.includes("telefon") || c==="";
}

/* ---------- CHAMADAS RECEBIDAS ----------
   Os campos _date/_status/_esp/_dur já vêm pré-calculados de normalizeSheet()
   (ver SHEET_ENRICHERS) — aqui só filtramos, sem reprocessar linha a linha. */
function getReceivedFiltered(){
  if(!canalAllows("Receptivo")) return [];
  const rows = state.rows.received || [];
  const out = [];
  for(let i=0;i<rows.length;i++){ const r=rows[i]; if(inPeriod(r._date) && passesFilters(r)) out.push(r); }
  return out;
}
function computeReceivedMetrics(rows){
  const entrantes = rows.length;
  const atendidas = rows.filter(r=>r._status==="Atendida");
  const naoAtendidas = rows.filter(r=>r._status==="NaoAtendida");
  const comEspera = atendidas.filter(r=>isFinite(r._esp));
  const atendidas20 = comEspera.filter(r=>r._esp<=20).length;
  const atendidas60 = comEspera.filter(r=>r._esp<=60).length;
  const acima5 = comEspera.filter(r=>r._esp>5).length;

  const pctAtendidas20 = comEspera.length? atendidas20/comEspera.length : NaN;
  const pctAtendidas60 = comEspera.length? atendidas60/comEspera.length : NaN;
  const pctAbandono = entrantes? naoAtendidas.length/entrantes : NaN;
  const pctAtendidas = entrantes? atendidas.length/entrantes : NaN;
  const nivelServico = (atendidas.length+naoAtendidas.length) ? (atendidas20*100/(atendidas.length+naoAtendidas.length)) : NaN;
  const ctee = comEspera.length ? acima5*100/comEspera.length : NaN;
  const tma = avg(atendidas.map(r=>r._dur));
  const tme = avg(atendidas.map(r=>r._esp));

  const byClientDay = {};
  atendidas.forEach(r=>{
    if(!r.contato || !r._date) return;
    const key = r.contato+"|"+r._date.toDateString();
    byClientDay[key] = (byClientDay[key]||0)+1;
  });
  let rechamadas = 0;
  Object.values(byClientDay).forEach(c=>{ if(c>1) rechamadas += (c-1); });
  const pctRechamadas = entrantes? rechamadas/entrantes : NaN;

  const transferFeitas = rows.filter(r=>isTransfer(r.transferPara));
  const transferRecebidas = rows.filter(r=>isTransfer(r.transferDe));

  return {
    entrantes, atendidas: atendidas.length, naoAtendidas: naoAtendidas.length,
    pctAtendidas20, pctAtendidas60, pctAbandono, pctAtendidas, aproveitamento: pctAtendidas,
    nivelServico, ctee, tma, tme, rechamadas, pctRechamadas,
    transferFeitas: transferFeitas.length, transferRecebidas: transferRecebidas.length
  };
}

/* ---------- CHAMADAS REALIZADAS (aba grande — só filtra, nada de reprocessar) ---------- */
function getMadeFiltered(){
  if(!canalAllows("Ativo")) return [];
  const rows = state.rows.made || [];
  const out = [];
  for(let i=0;i<rows.length;i++){ const r=rows[i]; if(inPeriod(r._date) && passesFilters(r)) out.push(r); }
  return out;
}
function computeMadeMetrics(rows){
  const total = rows.length;
  const atendidas = rows.filter(r=>r._status==="Atendida");
  const naoAtendidas = rows.filter(r=>r._status!=="Atendida");
  const curtas = atendidas.filter(r=>isFinite(r._dur) && r._dur<60).length;
  const longas = atendidas.filter(r=>isFinite(r._dur) && r._dur>=60).length;
  const taxaContato = (atendidas.length+naoAtendidas.length) ? (longas*100/(atendidas.length+naoAtendidas.length)) : NaN;
  const tma = avg(atendidas.map(r=>r._dur));
  const transferFeitas = rows.filter(r=>isTransfer(r.transferPara));
  return {total, atendidas: atendidas.length, naoAtendidas: naoAtendidas.length, curtas, longas, taxaContato, tma,
    transferFeitas: transferFeitas.length};
}

/* ---------- CHAT (registros brutos) ---------- */
function getChatFiltered(){
  if(!canalAllows("Chat")) return [];
  const rows = state.rows.chat || [];
  return rows.filter(r=> inPeriod(r._date) && passesFilters(r));
}

/* ---------- PERFORMANCE CHAT (agregado por agente/dia) ---------- */
function getChatPerfFiltered(){
  if(!canalAllows("Chat")) return [];
  const rows = state.rows.chatPerf || [];
  return rows.filter(r=> inPeriod(r._date) && passesFilters(r));
}
function computeChatPerfMetrics(rows){
  const tmeResp = avg(rows.filter(r=>isFinite(r._tmeResp) && r._tmeResp>0).map(r=>r._tmeResp));
  const tma = avg(rows.filter(r=>isFinite(r._tma) && r._tma>0).map(r=>r._tma));
  const satMedia = avg(rows.filter(r=>isFinite(r._satMedia)).map(r=>r._satMedia));
  return {tmeResp, tma, satMedia};
}

/* ---------- TRANSFERÊNCIAS (fonte: chamadas, não chat) ---------- */
function computeTransferSummary(){
  const received = getReceivedFiltered();
  const made = getMadeFiltered();
  const combined = [...received.map(r=>({agente:r.agente, setor:r.setor, transferPara:r.transferPara})),
                    ...made.map(r=>({agente:r.agente, setor:r.setor, transferPara:r.transferPara}))];
  const feitas = combined.filter(r=>isTransfer(r.transferPara));

  const porAgente = groupBy(feitas, r=>r.agente||"—");
  const porSetor = groupBy(feitas, r=>r.setor||"—");
  const agenteRank = Array.from(porAgente, ([agente,list])=>({agente, count:list.length})).sort((a,b)=>b.count-a.count);
  const setorRank = Array.from(porSetor, ([setor,list])=>({setor, count:list.length})).sort((a,b)=>b.count-a.count);

  return {totalTransferencias: feitas.length, totalChamadas: combined.length, agenteRank, setorRank,
    topAgente: agenteRank[0]||null, topSetor: setorRank[0]||null};
}

/* ---------- PERFORMANCE DE CHAT POR SETOR ---------- */
function computeChatPerfBySetor(){
  const setores = allSetores();
  const chatRows = getChatFiltered();
  const perfRows = getChatPerfFiltered();
  const satRows = getSatFiltered();
  const byChatSetor = groupBy(chatRows, r=>r.setor||"—");
  const byPerfSetor = groupBy(perfRows, r=>r.setor||"—");
  const bySatSetor = groupBy(satRows, r=>r.setor||"—");
  return setores.map(s=>{
    const total = (byChatSetor.get(s)||[]).length;
    const perf = computeChatPerfMetrics(byPerfSetor.get(s)||[]);
    const csat = computeCsat(bySatSetor.get(s)||[]).csat;
    return {setor:s, total, tmeResp:perf.tmeResp, tma:perf.tma, csat};
  }).filter(r=>r.total>0 || isFinite(r.tmeResp) || isFinite(r.tma) || isFinite(r.csat));
}

/* ---------- SATISFAÇÃO (CSAT) ---------- */
function getSatFiltered(){
  const rows = state.rows.satisfaction||[];
  return rows.filter(r=> inPeriod(r._date) && passesFilters(r) && satCanalMatches(r.canal));
}
function computeCsat(rows){
  const valid = rows.filter(r=>isFinite(r._nota));
  const total = valid.length;
  const promotoras = valid.filter(r=>r._nota>=4).length;
  const csat = total? promotoras/total : NaN;
  const media = avg(valid.map(r=>r._nota));
  const dist = [1,2,3,4,5].map(n=>valid.filter(r=>r._nota===n).length);
  return {total, csat, media, dist};
}

/* ---------- MONITORIA ---------- */
function getMonFiltered(){
  const rows = state.rows.monitoring||[];
  return rows.filter(r=> inPeriod(r._date) && passesFilters(r));
}
function computeMonitoria(rows){
  const valid = rows.filter(r=>isFinite(r._nota));
  const total = valid.length;
  const media = avg(valid.map(r=>r._nota));
  const maxima = valid.filter(r=>r._nota>=0.999).length;
  const pctMax = total? maxima/total : NaN;
  return {total, media, pctMax};
}

/* ---------- PAUSAS (duração em segundos) ---------- */
function getPauseFiltered(){
  const rows = state.rows.pause||[];
  return rows.filter(r=> inPeriod(r._date) && passesFilters(r));
}
function computePausasPorTipo(rows){
  const porTipo = groupBy(rows, r=>r.tipo||"—");
  const tipos = [];
  porTipo.forEach((list, tipo)=>{
    const totalSec = sum(list.map(r=>r._sec));
    const media = avg(list.map(r=>r._sec));
    const limite = pauseLimitSecFor(tipo, list[0]?.setor);
    const alertOnly = pauseIsAlertOnly(tipo);
    const excedentes = limite && !alertOnly ? list.filter(r=> r._sec > limite) : [];
    const alertaMedia = !!(alertOnly && limite && isFinite(media) && media > limite);
    tipos.push({tipo, totalSec, media, limite, alertOnly, alertaMedia, count:list.length, excedentesCount: excedentes.length,
      excedentesPct: list.length && !alertOnly ? excedentes.length/list.length : NaN});
  });
  return tipos.sort((a,b)=>b.totalSec-a.totalSec);
}
function computePausasPorSetor(rows){
  const porSetor = groupBy(rows, r=>r.setor||"—");
  const out = [];
  porSetor.forEach((list, setor)=>{
    const totalSec = sum(list.map(r=>r._sec));
    const agentes = new Set(list.map(r=>r.agente)).size;
    let excedentesCount = 0;
    list.forEach(r=>{ const lim = pauseLimitSecFor(r.tipo, r.setor); if(lim && !pauseIsAlertOnly(r.tipo) && r._sec>lim) excedentesCount++; });
    out.push({setor, totalSec, media: list.length? totalSec/list.length : NaN, count:list.length, agentes,
      excedentesPct: list.length? excedentesCount/list.length : NaN});
  });
  return out.sort((a,b)=>b.totalSec-a.totalSec);
}
function computePausasPorAgente(rows){
  const porAgente = groupBy(rows, r=>r.agente||"—");
  const out = [];
  porAgente.forEach((list, agente)=>{
    const totalSec = sum(list.map(r=>r._sec));
    let excedentesCount = 0;
    list.forEach(r=>{ const lim = pauseLimitSecFor(r.tipo, r.setor); if(lim && !pauseIsAlertOnly(r.tipo) && r._sec>lim) excedentesCount++; });
    const porTipoAgente = groupBy(list, r=>r.tipo||"—");
    let tipoMaisUsado = "—", maxSec=-1;
    porTipoAgente.forEach((l2,tipo)=>{ const s=sum(l2.map(r=>r._sec)); if(s>maxSec){maxSec=s; tipoMaisUsado=tipo;} });
    out.push({agente, totalSec, count:list.length, excedentesCount, tipoMaisUsado});
  });
  return out.sort((a,b)=>b.totalSec-a.totalSec);
}

/* ---------- RANKING GERAL DE AGENTES ---------- */
function buildAgentRanking(category){
  const received = getReceivedFiltered();
  const made = getMadeFiltered();
  const chatRows = getChatFiltered();
  const sats = getSatFiltered();
  const mons = getMonFiltered();

  const agentSet = new Set();
  received.forEach(r=>{ if(r.agente) agentSet.add(r.agente); });
  made.forEach(r=>{ if(r.agente) agentSet.add(r.agente); });
  chatRows.forEach(r=>{ if(r.agente) agentSet.add(r.agente); });
  sats.forEach(r=>{ if(r.agente) agentSet.add(r.agente); });
  mons.forEach(r=>{ if(r.agente) agentSet.add(r.agente); });

  const byRec = groupBy(received, r=>r.agente||"—");
  const byMade = groupBy(made, r=>r.agente||"—");
  const byChat = groupBy(chatRows, r=>r.agente||"—");
  const bySat = groupBy(sats, r=>r.agente||"—");
  const byMon = groupBy(mons, r=>r.agente||"—");

  const list = Array.from(agentSet).map(agente=>{
    const recList = byRec.get(agente)||[];
    const madeList = byMade.get(agente)||[];
    const chatList = byChat.get(agente)||[];
    // "Chamadas realizadas" no ranking só conta atendidas com duração >= 60s (contato real, não caixa postal)
    const madeValidList = madeList.filter(r=>r._status==="Atendida" && isFinite(r._dur) && r._dur>=60);
    const sList = (bySat.get(agente)||[]).filter(r=>isFinite(r._nota));
    const mList = (byMon.get(agente)||[]).filter(r=>isFinite(r._nota));
    // Total = soma bruta de recebidas + realizadas (>=60s) + atendimentos de chat. Sem bônus escondido.
    const total = recList.length + madeValidList.length + chatList.length;
    const csat = sList.length ? sList.filter(r=>r._nota>=4).length/sList.length : NaN;
    const notaMonMedia = mList.length ? avg(mList.map(r=>r._nota)) : NaN; // já normalizada 0–1 (ver SHEET_ENRICHERS)
    let score;
    if(category==="geral") score = total;
    else if(category==="recebidas") score = recList.length;
    else if(category==="realizadas") score = madeValidList.length;
    else if(category==="satisfacao") score = isFinite(csat)? csat*100 : -1;
    else if(category==="monitoria") score = isFinite(notaMonMedia)? notaMonMedia*100 : -1;
    return {agente, total, recebidas:recList.length, realizadas:madeValidList.length, chat:chatList.length, csat, notaMonMedia, score};
  });
  return list.filter(a=>a.score>=0 || category==="geral").sort((a,b)=>b.score-a.score);
}

function rankingTableCard(title, headers, rows, opts={}){
  const limit = opts.limit || 20;
  const emptyText = opts.emptyText || "Sem dados suficientes para exibir este ranking.";
  if(!rows || !rows.length) return "";
  const body = rows.slice(0,limit).map((r,i)=>{
    const cells = r.map((v,j)=>{
      const first = j===0;
      return `<td>${first && opts.boldFirst ? `<b>${esc(v)}</b>` : v}</td>`;
    }).join("");
    return `<tr><td style="font-weight:800;color:${i<3?'var(--purple)':'var(--text-muted)'};">${i+1}º</td>${cells}</tr>`;
  }).join("");
  return `<div class="card ${opts.wide ? "card-wide" : ""}"><div class="card-title">${title}</div>
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>#</th>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${body || `<tr><td colspan="${headers.length+1}" style="color:var(--text-muted)">${emptyText}</td></tr>`}</tbody>
    </table></div></div>`;
}
function simpleTableCard(title, headers, rows){
  if(!rows || !rows.length) return "";
  return `<div class="card"><div class="card-title">${title}</div>
    <div class="table-wrap"><table class="data-table">
      <thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${r.map((v,j)=>`<td>${j===0?`<b>${esc(v)}</b>`:v}</td>`).join("")}</tr>`).join("")}</tbody>

}

function renderOverview(){
  const received = getReceivedFiltered();
  const made = getMadeFiltered();
  const chatRows = getChatFiltered();
  const rm = computeReceivedMetrics(received);
  const mm = computeMadeMetrics(made);
  const sat = computeCsat(getSatFiltered());
  const mon = computeMonitoria(getMonFiltered());

  const hasReceived = hasSheetData('received');
  const hasMade = hasSheetData('made');
  const hasChat = hasSheetData('chat');
  const hasSat = hasSheetData('satisfaction');
  const hasMon = hasSheetData('monitoring');
  const hasCanal = hasReceived || hasMade || hasChat;
  const volumeTotal = received.length + made.length + chatRows.length;

  const kpis = [
    kpiCard("Volume total de atendimentos", fmtNum(volumeTotal), `Receptivo ${fmtNum(received.length)} · Ativo ${fmtNum(made.length)} · Chat ${fmtNum(chatRows.length)}`),
    hasReceived ? kpiCard("Nível de serviço", fmtPct(rm.nivelServico/100), "chamadas atendidas em até 20 segundos * 100 / (chamadas atendidas na fila + chamadas abandonadas na fila)", badgeFor(rm.nivelServico/100,0.8)) : "",
    hasReceived ? kpiCard("Taxa de abandono", fmtPct(rm.pctAbandono), "não atendidas / entrantes (receptivo)", badgeFor(1-rm.pctAbandono,0.92)) : "",
    hasSat ? kpiCard("CSAT", fmtPct(sat.csat), `${fmtNum(sat.total)} avaliações · nota média ${fmtNum(sat.media,2)}`, badgeFor(sat.csat,0.85)) : "",
    hasMon ? kpiCard("Nota de monitoria", fmtPct(mon.media), `${fmtNum(mon.total)} monitorias · ${fmtPct(mon.pctMax)} nota máxima`, badgeFor(mon.media,0.85)) : "",
    (hasReceived||hasMade) ? kpiCard("TMA", fmtSec(avg([rm.tma, mm.tma].filter(isFinite))), "receptivo + ativo") : "",
    hasReceived ? kpiCard("TME", fmtSec(rm.tme), "tempo médio de espera (receptivo)") : "",
  ].filter(Boolean);

  const monthMap = new Map();
  const weekday = [0,0,0,0,0,0,0];
  const setorMap = new Map();
  const setorMonthMap = new Map();

  function tally(rows, canalKey){
    for(const r of rows){
      const d = r._date;
      if(!d) continue;
      const mk = monthKeyISO(d);
      if(!monthMap.has(mk)) monthMap.set(mk, {Receptivo:0,Ativo:0,Chat:0,_date:d});
      monthMap.get(mk)[canalKey]++;
      weekday[d.getDay()]++;
      const s = r.setor || "—";
      setorMap.set(s, (setorMap.get(s)||0)+1);
      if(!setorMonthMap.has(mk)) setorMonthMap.set(mk, new Map());
      const sm = setorMonthMap.get(mk);
      sm.set(s, (sm.get(s)||0)+1);
    }
  }
  tally(received,"Receptivo"); tally(made,"Ativo"); tally(chatRows,"Chat");

  const months = Array.from(monthMap.keys()).sort();
  const monthLabels = months.map(m=>monthLabelShort(monthMap.get(m)._date));
  const setorLabels = Array.from(setorMap.keys()).sort((a,b)=>setorMap.get(b)-setorMap.get(a));

  const cards = [];

  if(hasCanal && months.length){
    const rows = months.map((m,i)=>{
      const x=monthMap.get(m);
      return [monthLabels[i], fmtNum(x.Receptivo), fmtNum(x.Ativo), fmtNum(x.Chat), `<b>${fmtNum(x.Receptivo+x.Ativo+x.Chat)}</b>`];
    });
    cards.push(simpleTableCard("Mix de canais por mês",["Mês","Receptivo","Ativo","Chat","Total"],rows));
  }

  if(hasCanal && weekday.some(v=>v>0)){
    const labels=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    const rows=labels.map((d,i)=>[d,weekday[i]]).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]).map(r=>[r[0],fmtNum(r[1])]);
    cards.push(rankingTableCard("Ranking de volume por dia da semana",["Dia","Atendimentos"],rows,{boldFirst:true}));
  }

  if(hasCanal && setorLabels.length && months.length){
    const rows=setorLabels.map(s=>{
      const vals=months.map(m=>(setorMonthMap.get(m)||new Map()).get(s)||0);
      const total=vals.reduce((a,b)=>a+b,0);
      return [s,...vals.map(v=>fmtNum(v)),`<b>${fmtNum(total)}</b>`,total];
    }).sort((a,b)=>b[b.length-1]-a[a.length-1]).map(r=>r.slice(0,-1));
    cards.push(rankingTableCard("Ranking de atendimentos por setor e mês",["Setor",...monthLabels,"Total"],rows,{boldFirst:true,wide:true}));
  }

  if(hasCanal && setorLabels.length){
    const rows=setorLabels.map(s=>[s,fmtNum(setorMap.get(s))]);
    cards.push(rankingTableCard("Ranking de volume por setor",["Setor","Atendimentos"],rows,{boldFirst:true}));
  }

  if(hasSat){
    const bySatSetor=groupBy(getSatFiltered(),r=>r.setor||"—");
    const rows=Array.from(bySatSetor.entries()).map(([s,rs])=>{
      const c=computeCsat(rs);
      return [s,c.csat, c.total];
    }).filter(r=>isFinite(r[1]) && r[2]>0).sort((a,b)=>b[1]-a[1])
      .map(r=>[r[0],fmtPct(r[1]),fmtNum(r[2])]);
    cards.push(rankingTableCard("Ranking de satisfação por setor",["Setor","CSAT","Avaliações"],rows,{boldFirst:true}));
  }

  if(hasCanal){
    const channelRows=[["Receptivo",received.length],["Ativo",made.length],["Chat",chatRows.length]]
      .filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]).map(r=>[r[0],fmtNum(r[1])]);
    cards.push(rankingTableCard("Ranking de volume por canal",["Canal","Atendimentos"],channelRows,{boldFirst:true}));
  }

  if(hasSat && sat.dist.some(v=>v>0)){
    const noteRows=sat.dist.map((v,i)=>({nota:i+1,count:v})).filter(r=>r.count>0).sort((a,b)=>b.count-a.count)
      .map(r=>[String(r.nota),fmtNum(r.count)]);
    cards.push(rankingTableCard("Ranking da distribuição das notas de satisfação",["Nota","Avaliações"],noteRows,{boldFirst:true}));
  }

  return `
  ${usingPublishedSnapshot ? `<div class="note-box" style="margin-bottom:18px;">📦 Dados publicados em ${publishedSnapshotAt ? new Date(publishedSnapshotAt).toLocaleString('pt-BR') : "data desconhecida"}.</div>` : ""}
  <div class="section-title"><span class="chev">›</span> Indicadores gerais</div>
  <div class="kpi-grid">${kpis.join("")}</div>
  ${cards.length ? `<div class="section-title"><span class="chev">›</span> Rankings e comparativos</div><div class="grid-auto">${cards.join("")}</div>` : ""}
  `;
}

function renderSector(){
  const setores = state.filters.setor==="all" ? allSetores() : [state.filters.setor];
  const received=getReceivedFiltered(), made=getMadeFiltered(), chatRows=getChatFiltered();
  const sats=getSatFiltered(), mons=getMonFiltered(), pauses=getPauseFiltered();
  const hasReceived=hasSheetData('received'), hasMade=hasSheetData('made'), hasChat=hasSheetData('chat');
  const hasSat=hasSheetData('satisfaction'), hasMon=hasSheetData('monitoring'), hasPause=hasSheetData('pause');
  const hasCanal=hasReceived||hasMade||hasChat;

  const byRecSetor=groupBy(received,r=>r.setor||"—");
  const byMadeSetor=groupBy(made,r=>r.setor||"—");
  const byChatSetor=groupBy(chatRows,r=>r.setor||"—");
  const bySatSetor=groupBy(sats,r=>r.setor||"—");
  const byMonSetor=groupBy(mons,r=>r.setor||"—");
  const byPauseSetor=groupBy(pauses,r=>r.setor||"—");

  const rows=setores.map(s=>{
    const rm=computeReceivedMetrics(byRecSetor.get(s)||[]);
    const mm=computeMadeMetrics(byMadeSetor.get(s)||[]);
    const chatCount=(byChatSetor.get(s)||[]).length;
    const sat=computeCsat(bySatSetor.get(s)||[]);
    const mon=computeMonitoria(byMonSetor.get(s)||[]);
    const pauseTotal=sum((byPauseSetor.get(s)||[]).map(r=>r._sec));
    const volume=(byRecSetor.get(s)||[]).length+(byMadeSetor.get(s)||[]).length+chatCount;
    return {setor:s,volume,...rm,tmaComb:avg([rm.tma,mm.tma].filter(isFinite)),csat:sat.csat,notaMon:mon.media,pauseTotal};
  }).sort((a,b)=>b.volume-a.volume);

  const columns=[
    {always:true,label:"Setor",render:r=>`<b>${esc(r.setor)}</b>`},
    {always:true,label:"Volume",render:r=>fmtNum(r.volume)},
    {show:hasReceived,label:"% Abandono",render:r=>fmtPct(r.pctAbandono)},
    {show:hasReceived,label:"Nível de Serviço",render:r=>fmtPct(r.nivelServico/100)},
    {show:hasReceived||hasMade,label:"TMA",render:r=>fmtSec(r.tmaComb)},
    {show:hasReceived,label:"TME",render:r=>fmtSec(r.tme)},
    {show:hasSat,label:"CSAT",render:r=>fmtPct(r.csat)},
    {show:hasMon,label:"Nota Monitoria",render:r=>fmtPct(r.notaMon)},
    {show:hasPause,label:"Tempo em Pausa",render:r=>fmtSec(r.pauseTotal)},
  ].filter(c=>c.always||c.show);

  const cards=[];
  if(hasCanal){
    const volumeRows=rows.filter(r=>r.volume>0).map(r=>[r.setor,fmtNum(r.volume)]);
    cards.push(rankingTableCard("Ranking de volume de atendimentos por setor",["Setor","Atendimentos"],volumeRows,{boldFirst:true}));
  }
  if(hasSat){
    const csatRows=rows.filter(r=>isFinite(r.csat) && (bySatSetor.get(r.setor)||[]).length>0)
      .sort((a,b)=>b.csat-a.csat).map(r=>[r.setor,fmtPct(r.csat),fmtNum((bySatSetor.get(r.setor)||[]).length)]);
    cards.push(rankingTableCard("Ranking de CSAT por setor",["Setor","CSAT","Avaliações"],csatRows,{boldFirst:true}));
  }

  return `
  ${cards.length ? `<div class="section-title"><span class="chev">›</span> Rankings por setor</div><div class="grid-auto">${cards.join("")}</div>` : ""}
  <div class="section-title"><span class="chev">›</span> Detalhamento por setor</div>
  <div class="card"><div class="table-wrap"><table class="data-table" id="tblSector">
    <thead><tr>${columns.map(c=>`<th>${c.label}</th>`).join("")}</tr></thead>
    <tbody>${rows.filter(r=>r.volume>0 || setores.length===1).map(r=>`<tr>${columns.map(c=>`<td>${c.render(r)}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div></div>`;
}

function rankRow(a, i){
  const pos = i+1;
  const cls = pos===1?"top1":pos===2?"top2":pos===3?"top3":"";
  const initials = (a.agente||"?").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  let scoreDisplay;
  if(rankingCategory==="satisfacao"||rankingCategory==="monitoria") scoreDisplay = isFinite(a.score)&&a.score>=0 ? a.score.toFixed(1)+"%" : "—";
  else scoreDisplay = fmtNum(a.score);
  const badgeLabel = pos<=3 ? `${pos}º Colocado` : `${pos}º lugar`;
  return `<div class="rank-row ${cls}">
    <div class="rank-pos">${pos}</div>
    <div class="rank-avatar">${initials}</div>
    <div class="rank-info">
      <div class="rank-name">${esc(a.agente)}</div>

    </div>
    <div class="rank-score">
      <div class="val">${scoreDisplay}</div>
      <div class="rank-badge">${badgeLabel}</div>
    </div>
  </div>`;
}

  const persistWarning = (rowCount>0 && rawPersistFailed[key]) ? `
    <div class="note-box warn" style="margin-top:10px;">
      Essa aba tem <b>${rowCount.toLocaleString('pt-BR')}</b> registros — grande demais para caber no armazenamento do navegador.
      Os dados continuam aparecendo agora, mas se você recarregar a página (F5) essa aba específica vai precisar ser buscada de novo em "Carregar / Atualizar todas as fontes".
    </div>` : "";

  return `
  <div class="config-block" data-sheet="${key}">
    <h3>${sheet.label} ${status}</h3>
    <p class="hint">${sheet.hint||""} Cole o link CSV publicado da aba "${sheet.label}" da sua planilha.</p>
    <div class="config-row">
      <input type="text" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv" data-url-input="${key}" value="${esc(url)}">
      <button class="btn btn-ghost btn-sm" data-load-btn="${key}">Carregar</button>
      <button class="btn btn-ghost btn-sm" data-paste-toggle="${key}">Colar CSV manualmente</button>
    </div>
    <textarea class="textarea-fallback" data-paste-area="${key}" placeholder="Cole aqui o conteúdo CSV se o link automático não funcionar (CORS)."></textarea>
    ${persistWarning}
    ${headers.length ? mappingUI(key, sheet, headers, mapping) : ""}
  </div>`;
}
function mappingUI(key, sheet, headers, mapping){
  return `<div class="map-grid">
    ${sheet.fields.map(f=>`
      <div class="map-field ${f.required?'':'optional'}">
        <label>${f.label}</label>
        <select data-map="${key}|${f.key}">
          <option value="">— não mapear —</option>
          ${headers.map(h=>`<option value="${esc(h)}" ${mapping[f.key]===h?'selected':''}>${esc(h)}</option>`).join("")}
        </select>
      </div>`).join("")}
  </div>`;
}

function bindConfigEvents(){
  document.querySelectorAll('[data-url-input]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ state.urls[inp.dataset.urlInput] = inp.value; saveConfig(); });
  });
  document.querySelectorAll('[data-load-btn]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.loadBtn;
      const input = document.querySelector(`[data-url-input="${key}"]`);
      state.urls[key] = input.value;
      await loadSheetWithFeedback(key);
    });
  });
  document.querySelectorAll('[data-paste-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.pasteToggle;
      const ta = document.querySelector(`[data-paste-area="${key}"]`);
      ta.style.display = ta.style.display==="block" ? "none" : "block";
      if(ta.style.display==="block" && !ta.dataset.bound){
        ta.dataset.bound = "1";
        ta.addEventListener('change', ()=>{
          if(ta.value.trim()){
            loadPastedCsv(key, ta.value);
            normalizeSheetIfMapped(key);
            saveConfig();
            saveRawData(key);
            renderScreen();
          }
        });
      }
    });
  });
  document.querySelectorAll('[data-map]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const [key, field] = sel.dataset.map.split("|");
      if(!state.mapping[key]) state.mapping[key] = {};
      state.mapping[key][field] = sel.value || undefined;
      normalizeSheet(key);
      saveConfig();
      updateSidebarStatus();
    });
  });
  document.getElementById('btnLoadAll')?.addEventListener('click', loadAllSheets);
  document.getElementById('btnSaveConfig')?.addEventListener('click', ()=>{ saveConfig(); alert('Configuração salva.'); });
  document.getElementById('btnExportConfig')?.addEventListener('click', exportConfig);
  document.getElementById('btnExportSnapshot')?.addEventListener('click', exportPublishedSnapshot);
  document.getElementById('btnCopyDefaultsCode')?.addEventListener('click', copyDefaultsCodeToClipboard);
  document.getElementById('btnImportConfig')?.addEventListener('click', ()=>{
    document.getElementById('importConfigInput').click();
  });
  document.getElementById('importConfigInput')?.addEventListener('change', (e)=>{
    if(e.target.files && e.target.files[0]) importConfigFile(e.target.files[0]);
  });
}

function exportConfig(){
  const data = JSON.stringify({urls: state.urls, mapping: state.mapping}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'agility-insights-config.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importConfigFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      state.urls = parsed.urls || {};
      state.mapping = parsed.mapping || {};
      saveConfig();
      renderScreen();
      updateSidebarStatus();
      alert('Configuração importada com sucesso. Clique em "Carregar / Atualizar todas as fontes" para buscar os dados.');
    }catch(err){
      alert('Não foi possível ler esse arquivo como configuração válida.');
    }
  };
  reader.readAsText(file);
}
function normalizeSheetIfMapped(key){ if(state.mapping[key]) normalizeSheet(key); }

async function loadSheetWithFeedback(key){
  loadGeneration++;
  const myGen = loadGeneration;
  showLoading(`Carregando ${SHEETS[key].label}...`);
  const res = await fetchSheet(key, count=>{
    if(myGen!==loadGeneration) return;
    showLoading(`Carregando ${SHEETS[key].label}... ${count.toLocaleString('pt-BR')} linhas`);
  });
  if(myGen!==loadGeneration) return; // foi cancelado — não sobrescreve o que o usuário está vendo agora
  hideLoading();
  if(!res.ok){
    const ta = document.querySelector(`[data-paste-area="${key}"]`);
    if(ta) ta.style.display = "block";
    const block = document.querySelector(`.config-block[data-sheet="${key}"]`);
    if(block && !block.querySelector('.fetch-error-note')){
      const note = document.createElement('div');
      note.className = 'note-box warn fetch-error-note';
      const msg = res.reason==="timeout"
        ? `O carregamento passou de 2min30 e foi interrompido automaticamente. Se essa aba for muito grande, considere republicar só as colunas necessárias (ou uma versão resumida por dia/agente), ou use "Colar CSV manualmente" abaixo.`
        : `Não foi possível buscar esse link automaticamente (provavelmente CORS, link não publicado, ou a rede caiu no meio do carregamento). Use "Colar CSV manualmente" acima como alternativa.`;
      note.innerHTML = msg;
      block.appendChild(note);
    }
  } else {
    normalizeSheetIfMapped(key);
    saveConfig();
    await saveRawData(key);
  }
  renderScreen();
  updateSidebarStatus();
}
async function loadAllSheets(){
  loadGeneration++;
  const myGen = loadGeneration;
  for(const key of Object.keys(SHEETS)){
    if(myGen!==loadGeneration) return; // cancelado no meio do processo
    if(state.urls[key]){
      showLoading(`Carregando ${SHEETS[key].label}...`);
      const res = await fetchSheet(key, count=>{
        if(myGen!==loadGeneration) return;
        showLoading(`Carregando ${SHEETS[key].label}... ${count.toLocaleString('pt-BR')} linhas`);
      });
      if(myGen!==loadGeneration) return; // cancelado durante esta aba
      if(res.ok){ normalizeSheetIfMapped(key); await saveRawData(key); }
      else if(res.reason==="timeout"){
        showLoading(`${SHEETS[key].label} demorou demais e foi pulada (mais de 2min30). Tentando a próxima...`);
        await new Promise(r=>setTimeout(r, 1200));
      }
    }
  }
  if(myGen!==loadGeneration) return;
  saveConfig();
  hideLoading();
  renderScreen();
  updateSidebarStatus();
}
async function refreshAllData(){ await loadAllSheets(); }

function cancelLoading(){
  loadGeneration++; // invalida qualquer callback pendente de carregamentos em andamento
  hideLoading();
  renderScreen();
  updateSidebarStatus();
}

function showLoading(text){
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingOverlay').style.display = 'flex';
}
function hideLoading(){ document.getElementById('loadingOverlay').style.display = 'none'; }

function updateSidebarStatus(){
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const loaded = Object.keys(SHEETS).filter(k=>(state.raw[k]||[]).length>0);
  if(loaded.length===0){ dot.className='status-dot off'; text.textContent='Nenhuma fonte conectada'; }
  else if(loaded.length<Object.keys(SHEETS).length){ dot.className='status-dot warn'; text.textContent=`${loaded.length}/${Object.keys(SHEETS).length} fontes conectadas`; }
  else { dot.className='status-dot'; text.textContent='Todas as fontes conectadas'; }
}


/* ============================================================
   BOOTSTRAP
   ------------------------------------------------------------
   Ao abrir (ou apertar F5), o painel busca a versão mais recente das
   planilhas automaticamente, usando os links salvos neste navegador OU os
   links padrão embutidos no código (DEFAULT_URLS) — o que faz o site
   funcionar "ao vivo" para qualquer pessoa, mesmo sem nenhuma configuração
   prévia no navegador dela.

   - Se já existem dados em cache (deste navegador): mostramos a tela de
     Visão Geral IMEDIATAMENTE com o que já está salvo, e a busca ao vivo
     roda por baixo dos panos (indicador discreto no topo) — só atualiza os
     números quando terminar com sucesso. Se a busca falhar, os dados em
     cache continuam na tela, nada desaparece.
   - Se este navegador nunca carregou nada (ex.: primeira vez que alguém
     abre o link): mostramos a tela de carregamento (com botão Cancelar)
     enquanto busca pela primeira vez. Se não conseguir, tentamos o arquivo
     estático publicado (agility-data.json), e só então caímos na tela de
     Configuração, para conectar as fontes manualmente. */
async function initApp(){
  renderNav();
  await loadConfig();
  await loadAllRawData();
  document.getElementById('menuToggle').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('open');
  });
  document.getElementById('btnCancelLoad').addEventListener('click', cancelLoading);

  if(hasAnyData()){
    normalizeAllSheets();
    goToScreen("overview");
    updateSidebarStatus();
    backgroundAutoRefresh(); // atualiza por baixo dos panos, sem apagar o que já está na tela
  } else {
    const gotLive = await foregroundAutoRefresh();
    if(!gotLive) await loadPublishedSnapshotIfNeeded();
    normalizeAllSheets();
    goToScreen(hasAnyData() ? "overview" : "config");
    updateSidebarStatus();
  }
}
window.addEventListener('DOMContentLoaded', initApp);

</script>
