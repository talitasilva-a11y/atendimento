<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agility Insights — Painel de Atendimento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --purple:#7063F0;
  --purple-dark:#5347d1;
  --purple-light:#EEEBFF;
  --orange:#FF7029;
  --orange-light:#FFE9DD;
  --dark:#1C1F26;
  --dark-2:#262A33;
  --dark-3:#333846;
  --bg:#F5F6FA;
  --card:#FFFFFF;
  --text:#1C1F26;
  --text-muted:#6B7280;
  --border:#E7E8EF;
  --gold:#F5A623;
  --silver:#9CA3AF;
  --bronze:#C97B4A;
  --green:#22C55E;
  --red:#EF4444;
  --radius:14px;
  --shadow:0 2px 10px rgba(28,31,38,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Sora',sans-serif;margin:0;letter-spacing:-0.01em;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D8D9E4;border-radius:8px;}
button{font-family:inherit;cursor:pointer;}
a{color:var(--purple);text-decoration:none;}
table{border-collapse:collapse;width:100%;}
input,select{font-family:inherit;}

/* ---------- LAYOUT ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:230px;flex:none;background:var(--dark);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.sidebar-logo{
  padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08);
}
.sidebar-logo img{width:150px;display:block;}
.nav{flex:1;padding:14px 10px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;margin-bottom:2px;border-radius:10px;
  color:#B7BAC6;font-size:13.5px;font-weight:500;
  cursor:pointer;position:relative;transition:background .15s,color .15s;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--purple);color:#fff;}
.nav-item.active::before{
  content:"›";position:absolute;left:-2px;top:50%;transform:translateY(-50%);
  color:var(--orange);font-size:18px;font-weight:800;font-family:'Sora',sans-serif;
  display:none;
}
.nav-icon{width:17px;height:17px;flex:none;display:flex;align-items:center;justify-content:center;}
.nav-icon svg{width:100%;height:100%;}
.nav-section-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:#5C6070;
  padding:16px 14px 6px;font-weight:700;
}
.sidebar-footer{padding:14px;border-top:1px solid rgba(255,255,255,0.08);}
.status-pill{
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8B8F9E;padding:6px 8px;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;}
.status-dot.off{background:#5C6070;}
.status-dot.warn{background:var(--orange);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;position:sticky;top:0;z-index:20;flex-wrap:wrap;
}
.topbar-title{display:flex;align-items:center;gap:10px;}
.topbar-title .chevron{color:var(--orange);font-family:'Sora',sans-serif;font-weight:800;font-size:20px;}
.topbar-title h1{font-size:19px;}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.filter-select{
  border:1px solid var(--border);background:var(--bg);border-radius:9px;
  padding:8px 10px;font-size:12.5px;color:var(--text);min-width:110px;
}
.btn{
  border:none;border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:var(--purple);color:#fff;}
.btn-primary:hover{background:var(--purple-dark);}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{background:#ECEDF3;}
.btn-sm{padding:6px 10px;font-size:11.5px;}

.content{padding:24px 28px 60px;flex:1;}
.screen{display:none;}
.screen.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.section-title{
  display:flex;align-items:center;gap:8px;margin:28px 0 14px;font-size:15px;font-weight:700;color:var(--text);
}
.section-title:first-child{margin-top:0;}
.section-title .chev{color:var(--orange);font-weight:800;font-family:'Sora',sans-serif;}

/* ---------- KPI CARDS ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
.kpi-card{
  background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.kpi-label{font-size:11.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.kpi-value{font-family:'Sora',sans-serif;font-size:26px;font-weight:700;color:var(--text);}
.kpi-sub{font-size:11.5px;color:var(--text-muted);margin-top:4px;}
.kpi-badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;}
.badge-good{background:#DFF7E6;color:#15803D;}
.badge-bad{background:#FDE4E4;color:#B91C1C;}
.badge-neutral{background:var(--purple-light);color:var(--purple-dark);}

.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:1000px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.card{
  background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.card-title{font-size:13.5px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.card-title small{color:var(--text-muted);font-weight:500;font-size:11.5px;}
.chart-wrap{position:relative;height:260px;}
.chart-wrap.tall{height:320px;}

/* ---------- TABLES ---------- */
.table-wrap{overflow-x:auto;}
table.data-table{font-size:12.5px;}
table.data-table th{
  text-align:left;padding:9px 12px;color:var(--text-muted);font-weight:600;font-size:11px;
  text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border);white-space:nowrap;
  cursor:pointer;user-select:none;
}
table.data-table th:hover{color:var(--purple);}
table.data-table td{padding:9px 12px;border-bottom:1px solid #F0F0F5;white-space:nowrap;}
table.data-table tbody tr:hover{background:#FAFAFD;}
.pill{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;}
.pill-green{background:#DFF7E6;color:#15803D;}
.pill-orange{background:var(--orange-light);color:#C1440E;}
.pill-red{background:#FDE4E4;color:#B91C1C;}
.pill-purple{background:var(--purple-light);color:var(--purple-dark);}
.pill-gray{background:#EEF0F4;color:var(--text-muted);}

/* ---------- RANKING (gamificado) ---------- */
.ranking-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--card);padding:6px;border-radius:14px;
  border:1px solid var(--border);width:fit-content;box-shadow:var(--shadow);flex-wrap:wrap;}
.rtab{
  display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:none;background:transparent;
  font-size:12.5px;font-weight:600;color:var(--text-muted);
}
.rtab svg{width:15px;height:15px;}
.rtab.active{background:var(--purple);color:#fff;}
.rank-list{display:flex;flex-direction:column;gap:10px;}
.rank-row{
  display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 18px;box-shadow:var(--shadow);
}
.rank-pos{
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-weight:800;font-size:13px;color:#fff;background:#C9CBD6;flex:none;
}
.rank-row.top1 .rank-pos{background:linear-gradient(135deg,#FFD65C,#F5A623);}
.rank-row.top2 .rank-pos{background:linear-gradient(135deg,#C9CDD6,#9CA3AF);}
.rank-row.top3 .rank-pos{background:linear-gradient(135deg,#E0A277,#C97B4A);}
.rank-avatar{
  width:42px;height:42px;border-radius:50%;background:var(--purple-light);color:var(--purple-dark);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;
  font-family:'Sora',sans-serif;
}
.rank-info{flex:1;min-width:0;}
.rank-name{font-weight:700;font-size:13.5px;color:var(--text);}
.rank-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.rank-score{text-align:right;flex:none;}
.rank-score .val{font-family:'Sora',sans-serif;font-weight:800;font-size:16px;}
.rank-badge{
  font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:3px;display:inline-block;
}
.rank-row.top1 .rank-badge{background:#FFF3D6;color:#8A5A00;}
.rank-row.top2 .rank-badge{background:#F1F2F5;color:#565C6B;}
.rank-row.top3 .rank-badge{background:#FBE7DB;color:#8A3E12;}
.rank-row:not(.top1):not(.top2):not(.top3) .rank-badge{background:var(--purple-light);color:var(--purple-dark);}

/* ---------- CONFIG SCREEN ---------- */
.config-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
.config-block h3{font-size:14.5px;margin-bottom:4px;}
.config-block p.hint{color:var(--text-muted);font-size:12px;margin:4px 0 14px;line-height:1.5;}
.config-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.config-row input[type=text]{
  flex:1;min-width:260px;border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:12.5px;
}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px;}
.map-field{display:flex;flex-direction:column;gap:4px;}
.map-field label{font-size:11.5px;color:var(--text-muted);font-weight:600;}
.map-field select{border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12px;}
.map-field.optional label::after{content:" (opcional)";color:#B6B9C4;font-weight:400;}
.sheet-status{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
.sheet-status.ok{background:#DFF7E6;color:#15803D;}
.sheet-status.err{background:#FDE4E4;color:#B91C1C;}
.sheet-status.empty{background:#EEF0F4;color:var(--text-muted);}
.textarea-fallback{width:100%;min-height:90px;border:1px solid var(--border);border-radius:9px;padding:10px;font-size:11.5px;font-family:monospace;margin-top:8px;display:none;}
.note-box{
  background:var(--purple-light);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--purple-dark);
  line-height:1.5;margin-top:8px;
}
.note-box.warn{background:var(--orange-light);color:#8A3E12;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty-state svg{width:52px;height:52px;margin-bottom:14px;opacity:.5;}
.empty-state h3{color:var(--text);margin-bottom:6px;}
.empty-state .btn{margin-top:16px;}

.loading-overlay{position:fixed;inset:0;background:rgba(28,31,38,0.4);display:none;align-items:center;justify-content:center;z-index:100;}
.loading-box{background:#fff;padding:24px 34px;border-radius:14px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:12px;}
.spinner{width:18px;height:18px;border:3px solid var(--purple-light);border-top-color:var(--purple);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.legend-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--text-muted);}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}

@media(max-width:900px){
  .sidebar{position:fixed;left:-230px;transition:left .2s;z-index:50;}
  .sidebar.open{left:0;}
  .content{padding:18px 14px;}
  .topbar{padding:12px 14px;}
}
.menu-toggle{display:none;background:none;border:none;padding:6px;}
.menu-toggle svg{width:22px;height:22px;}
@media(max-width:900px){.menu-toggle{display:flex;}}
</style>
</head>

  const tipo = (tipoRaw||"").toLowerCase();

  for(const p of PAUSE_TYPE_RULES){
    if(p.match.some(m=>tipo.includes(m))){
      if(p.dependsOnSetor){
        const isCAR = setor.includes("conta") && setor.includes("receber");
        return isCAR ? 15*60 : 10*60;
      }
      return p.limitSec;
    }
  }
  return null;
}
function pauseIsAlertOnly(tipoRaw){
  const tipo = (tipoRaw||"").toLowerCase();
  const rule = PAUSE_TYPE_RULES.find(p=>p.match.some(m=>tipo.includes(m)));
  return rule ? !!rule.alertOnly : false;
}

const HEADER_GUESSES = {
  data:["data","data início","data inicio"], agente:["atendente","agente"],
  contato:["contato"], setor:["setor"], status:["status da chamada","status"],
  quemDesligou:["quem desligou"], transferDe:["recebeu transferência de","recebeu transferencia de"],
  transferPara:["transferiu para"], tempoEspera:["tempo em espera"], tempoLigacao:["tempo em ligação","tempo em ligacao"],
  destino:["destino"], conversasSat:["conversas com satisfação","conversas com satisfacao"],
  satisfacaoMedia:["satisfação média","satisfacao media"], total:["total"], tma:["tma"], tmeResp:["tme 1ª resposta","tme 1a resposta"],
  canal:["canal"], nota:["nota"], tipo:["pausa"], duracao:["duracao","duração"], taxa:["taxa de abandono"]
};
function autoGuessMapping(sheetKey, headers){
  const map = {};
  const lowerHeaders = headers.map(h=>({raw:h, norm:String(h).trim().toLowerCase()}));
  SHEETS[sheetKey].fields.forEach(f=>{
    const guesses = HEADER_GUESSES[f.key] || [];
    for(const g of guesses){
      const found = lowerHeaders.find(h=>h.norm===g);
      if(found){ map[f.key] = found.raw; return; }
    }
  });
  return map;
}

/* ---------- CSV LOADING ---------- */
function parseCsvText(text){
  const res = Papa.parse(text, {header:true, skipEmptyLines:true, dynamicTyping:false});
  return {rows: res.data, headers: res.meta.fields || []};
}
async function fetchSheet(key){
  const url = (state.urls[key]||"").trim();
  if(!url) return {ok:false, reason:"no_url"};
  let fetchUrl = url;
  const m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(m && !/output=csv|\/pub\?/.test(url)){
    const gidMatch = url.match(/gid=([0-9]+)/);
    const gid = gidMatch ? gidMatch[1] : "0";
    fetchUrl = `https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv&gid=${gid}`;
  }
  try{
    const resp = await fetch(fetchUrl, {mode:"cors"});
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    const text = await resp.text();
    const {rows, headers} = parseCsvText(text);
    state.raw[key] = rows;
    state.headers[key] = headers;
    if(!state.mapping[key] || Object.keys(state.mapping[key]).length===0){
      state.mapping[key] = autoGuessMapping(key, headers);
    }
    return {ok:true, rows: rows.length};
  }catch(e){
    return {ok:false, reason:"fetch_error", error:e.message};
  }
}
function loadPastedCsv(key, text){
  const {rows, headers} = parseCsvText(text);
  state.raw[key] = rows;
  state.headers[key] = headers;
  if(!state.mapping[key] || Object.keys(state.mapping[key]).length===0){
    state.mapping[key] = autoGuessMapping(key, headers);
  }
}

/* ---------- HELPERS DE PARSING ---------- */
function toNumber(v){
  if(v===undefined||v===null||v==="") return NaN;
  if(typeof v==="number") return v;
  const raw = String(v).trim();
  if(raw==="-"||raw==="") return NaN;
  if(/^-?\d+(\.\d+)?$/.test(raw)) return parseFloat(raw);
  if(/^-?\d{1,3}(\.\d{3})*(,\d+)?$/.test(raw)) return parseFloat(raw.replace(/\./g,"").replace(",","."));
  if(/^-?\d+,\d+$/.test(raw)) return parseFloat(raw.replace(",","."));
  const f = parseFloat(raw);
  return isNaN(f)?NaN:f;
}
function parseDateFlexible(v){
  if(!v) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    let [_, d, mo, y, h, mi, se] = m;
    if(y.length===2) y = "20"+y;
    return new Date(+y, +mo-1, +d, +(h||0), +(mi||0), +(se||0));
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    let [_, y, mo, d, h, mi, se] = m;
    return new Date(+y, +mo-1, +d, +(h||0), +(mi||0), +(se||0));
  }
  const dd = new Date(s);
  return isNaN(dd.getTime()) ? null : dd;
}
function durationToSeconds(v){
  if(v===undefined||v===null||v==="") return NaN;
  const s = String(v).trim();
  if(s==="-") return NaN;
  if(/^\d{1,3}:\d{2}:\d{2}(\.\d+)?$/.test(s)){
    const [h,m,sec] = s.split(":");
    return (+h)*3600+(+m)*60+parseFloat(sec);
  }
  if(/^\d{1,3}:\d{2}$/.test(s)){
    const [m,sec] = s.split(":").map(Number);
    return m*60+sec;
  }
  return toNumber(s);
}
function normalizeStatus(v){
  const s = (v||"").toString().toLowerCase();
  if(s.includes("n\u00e3o")||s.includes("nao")) return "NaoAtendida";
  if(s.includes("aband")) return "NaoAtendida";
  if(s.includes("atend")) return "Atendida";
  return v || "Atendida";
}
function isTransfer(v){
  const s = (v||"").toString().trim();
  return s!=="" && s!=="-";
}
function ramalLabel(v){
  const s = (v||"").toString().trim().replace(/\.0$/,"");
  if(!s || s==="-") return null;
  return state.ramalMap[s] ? state.ramalMap[s] : `Ramal ${s}`;
}

/* ---------- NORMALIZAÇÃO ---------- */
function normalizeSheet(key){
  const map = state.mapping[key] || {};
  const rawRows = state.raw[key] || [];
  const out = [];
  for(const r of rawRows){
    const o = {};
    for(const f of SHEETS[key].fields){
      const header = map[f.key];
      o[f.key] = header ? r[header] : undefined;
    }
    out.push(o);
  }
  state.rows[key] = out;
  return out;
}
function normalizeAllSheets(){
  Object.keys(SHEETS).forEach(k=>{ if(state.raw[k]) normalizeSheet(k); });
}
/* ============================================================
   MOTOR DE CÁLCULO
   ============================================================ */

function fmtPct(v){ return isFinite(v) ? (v*100).toFixed(1).replace(".",",")+"%" : "—"; }
function fmtNum(v,d=0){ return isFinite(v) ? v.toLocaleString('pt-BR',{maximumFractionDigits:d, minimumFractionDigits:d}) : "—"; }
function fmtSec(v){
  if(!isFinite(v)) return "—";
  v = Math.round(v);
  const h = Math.floor(v/3600), m = Math.floor((v%3600)/60), s = v%60;
  if(h>0) return `${h}h ${String(m).padStart(2,'0')}m`;
  return `${m}m ${String(s).padStart(2,'0')}s`;
}
function avg(arr){ const v = arr.filter(x=>isFinite(x)); return v.length? v.reduce((a,b)=>a+b,0)/v.length : NaN; }
function sum(arr){ const v = arr.filter(x=>isFinite(x)); return v.length? v.reduce((a,b)=>a+b,0) : 0; }
function groupBy(rows, keyFn){
  const m = new Map();
  rows.forEach(r=>{ const k = keyFn(r); if(!m.has(k)) m.set(k, []); m.get(k).push(r); });
  return m;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function monthKey(d){ return d.toLocaleDateString('pt-BR', {month:'2-digit', year:'numeric'}); }

function inPeriod(date){
  if(!date) return state.filters.period==="all";
  const now = new Date();
  const p = state.filters.period;
  if(p==="all") return true;
  if(p==="today") return sameDay(date, now);
  if(p==="7d"){ const d=new Date(now); d.setDate(d.getDate()-7); return date>=d; }
  if(p==="30d"){ const d=new Date(now); d.setDate(d.getDate()-30); return date>=d; }
  if(p==="month"){ return date.getMonth()===now.getMonth() && date.getFullYear()===now.getFullYear(); }
  if(p==="lastmonth"){ const d=new Date(now.getFullYear(), now.getMonth()-1,1); return date.getMonth()===d.getMonth() && date.getFullYear()===d.getFullYear(); }
  return true;
}
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }

function passesFilters(row, {setor=true, agente=true}={}){
  const f = state.filters;
  if(setor && f.setor!=="all" && (row.setor||"—")!==f.setor) return false;
  if(agente && f.agente!=="all" && (row.agente||"—")!==f.agente) return false;
  return true;
}
// canal filter só é aplicável a fontes onde o canal é o próprio conjunto de dados (recebidas/realizadas/chat)
function canalAllows(canalName){
  const f = state.filters.canal;
  return f==="all" || f===canalName;
}
// satisfação/monitoria usam vocabulário próprio de canal (Telefonia/Chat/instagram) — melhor esforço
function satCanalMatches(rawCanal){
  const f = state.filters.canal;
  if(f==="all") return true;
  const c = (rawCanal||"").toLowerCase();
  if(f==="Chat") return c.includes("chat");
  return c.includes("telefon") || c==="";
}

/* ---------- CHAMADAS RECEBIDAS ---------- */
function getReceivedFiltered(){
  if(!canalAllows("Receptivo")) return [];
  const rows = state.rows.received || [];
  return rows.map(r=>({...r, _date: parseDateFlexible(r.data), _status: normalizeStatus(r.status),
      _esp: toNumber(r.tempoEspera), _dur: toNumber(r.tempoLigacao)}))
    .filter(r=> inPeriod(r._date) && passesFilters(r));
}
function computeReceivedMetrics(rows){
  const entrantes = rows.length;
  const atendidas = rows.filter(r=>r._status==="Atendida");
  const naoAtendidas = rows.filter(r=>r._status==="NaoAtendida");
  const comEspera = atendidas.filter(r=>isFinite(r._esp));
  const atendidas20 = comEspera.filter(r=>r._esp<=20).length;
  const atendidas60 = comEspera.filter(r=>r._esp<=60).length;
  const acima5 = comEspera.filter(r=>r._esp>5).length;

  const pctAtendidas20 = comEspera.length? atendidas20/comEspera.length : NaN;
  const pctAtendidas60 = comEspera.length? atendidas60/comEspera.length : NaN;
  const pctAbandono = entrantes? naoAtendidas.length/entrantes : NaN;
  const pctAtendidas = entrantes? atendidas.length/entrantes : NaN;
  const nivelServico = (atendidas.length+naoAtendidas.length) ? (atendidas20*100/(atendidas.length+naoAtendidas.length)) : NaN;
  const ctee = comEspera.length ? acima5*100/comEspera.length : NaN;
  const tma = avg(atendidas.map(r=>r._dur));
  const tme = avg(atendidas.map(r=>r._esp));

  const byClientDay = {};
  atendidas.forEach(r=>{
    if(!r.contato || !r._date) return;
    const key = r.contato+"|"+r._date.toDateString();
    byClientDay[key] = (byClientDay[key]||0)+1;
  });
  let rechamadas = 0;
  Object.values(byClientDay).forEach(c=>{ if(c>1) rechamadas += (c-1); });

  const transferFeitas = rows.filter(r=>isTransfer(r.transferPara));
  const transferRecebidas = rows.filter(r=>isTransfer(r.transferDe));

  return {
    entrantes, atendidas: atendidas.length, naoAtendidas: naoAtendidas.length,
    pctAtendidas20, pctAtendidas60, pctAbandono, pctAtendidas, aproveitamento: pctAtendidas,
    nivelServico, ctee, tma, tme, rechamadas,
    transferFeitas: transferFeitas.length, transferRecebidas: transferRecebidas.length
  };
}

/* ---------- CHAMADAS REALIZADAS ---------- */
function getMadeFiltered(){
  if(!canalAllows("Ativo")) return [];
  const rows = state.rows.made || [];
  return rows.map(r=>({...r, _date: parseDateFlexible(r.data), _status: normalizeStatus(r.status), _dur: toNumber(r.tempoLigacao)}))
    .filter(r=> inPeriod(r._date) && passesFilters(r));
}
function computeMadeMetrics(rows){
  const total = rows.length;
  const atendidas = rows.filter(r=>r._status==="Atendida");
  const naoAtendidas = rows.filter(r=>r._status!=="Atendida");
  const curtas = atendidas.filter(r=>isFinite(r._dur) && r._dur<60).length;
  const longas = atendidas.filter(r=>isFinite(r._dur) && r._dur>=60).length;
  const taxaContato = (atendidas.length+naoAtendidas.length) ? (longas*100/(atendidas.length+naoAtendidas.length)) : NaN;
  const tma = avg(atendidas.map(r=>r._dur));
  const transferFeitas = rows.filter(r=>isTransfer(r.transferPara));
  return {total, atendidas: atendidas.length, naoAtendidas: naoAtendidas.length, curtas, longas, taxaContato, tma,
    transferFeitas: transferFeitas.length};
}

/* ---------- PERFORMANCE CHAT (agregado por agente/dia) ---------- */
function getChatPerfFiltered(){
  if(!canalAllows("Chat")) return [];
  const rows = state.rows.chatPerf || [];
  return rows.map(r=>({...r, _date: parseDateFlexible(r.data), _total: toNumber(r.total),
      _tma: durationToSeconds(r.tma), _tmeResp: durationToSeconds(r.tmeResp),
      _satMedia: toNumber(r.satisfacaoMedia), _conversasSat: toNumber(r.conversasSat)}))
    .filter(r=> inPeriod(r._date) && passesFilters(r));
}
function computeChatPerfMetrics(rows){
  const tmeResp = avg(rows.filter(r=>isFinite(r._tmeResp) && r._tmeResp>0).map(r=>r._tmeResp));
  const tma = avg(rows.filter(r=>isFinite(r._tma) && r._tma>0).map(r=>r._tma));
  const satMedia = avg(rows.filter(r=>isFinite(r._satMedia)).map(r=>r._satMedia));
  return {tmeResp, tma, satMedia};
}

/* ---------- TRANSFERÊNCIAS (fonte: chamadas, não chat) ---------- */
function computeTransferRanking(){
  const received = getReceivedFiltered();
  const made = getMadeFiltered();
  const combined = [...received.map(r=>({agente:r.agente, transferPara:r.transferPara})),
                    ...made.map(r=>({agente:r.agente, transferPara:r.transferPara}))];
  const feitas = combined.filter(r=>isTransfer(r.transferPara));
  const porOrigem = groupBy(feitas, r=>r.agente||"—");
  const origemRank = Array.from(porOrigem, ([agente,list])=>({agente, total:list.length})).sort((a,b)=>b.total-a.total);

  const porDestino = groupBy(feitas, r=>ramalLabel(r.transferPara)||"—");
  const destinoRank = Array.from(porDestino, ([agente,list])=>({agente, total:list.length})).sort((a,b)=>b.total-a.total);

  return {totalTransferencias: feitas.length, totalChamadas: combined.length, origemRank, destinoRank};
}

/* ---------- SATISFAÇÃO (CSAT) ---------- */
function getSatFiltered(){
  const rows = state.rows.satisfaction||[];
  return rows.map(r=>({...r, _date: parseDateFlexible(r.data), _nota: toNumber(r.nota)}))
    .filter(r=> inPeriod(r._date) && passesFilters(r) && satCanalMatches(r.canal));
}
function computeCsat(rows){
  const valid = rows.filter(r=>isFinite(r._nota));
  const total = valid.length;
  const promotoras = valid.filter(r=>r._nota>=4).length;
  const csat = total? promotoras/total : NaN;
  const media = avg(valid.map(r=>r._nota));
  const dist = [1,2,3,4,5].map(n=>valid.filter(r=>r._nota===n).length);
  return {total, csat, media, dist};
}

/* ---------- MONITORIA ---------- */
function getMonFiltered(){
  const rows = state.rows.monitoring||[];
  return rows.map(r=>({...r, _date: parseDateFlexible(r.data), _nota: toNumber(r.nota)}))
    .filter(r=> inPeriod(r._date) && passesFilters(r));
}
function computeMonitoria(rows){
  const valid = rows.filter(r=>isFinite(r._nota));
  const total = valid.length;
  const media = avg(valid.map(r=>r._nota));
  const maxima = valid.filter(r=>r._nota>=0.999).length;
  const pctMax = total? maxima/total : NaN;
  return {total, media, pctMax};
}

/* ---------- PAUSAS (duração em segundos) ---------- */
function getPauseFiltered(){
  const rows = state.rows.pause||[];
  return rows.map(r=>({...r, _date: parseDateFlexible(r.data), _sec: toNumber(r.duracao)}))
    .filter(r=> inPeriod(r._date) && passesFilters(r));
}
function computePausasPorTipo(rows){
  const porTipo = groupBy(rows, r=>r.tipo||"—");
  const tipos = [];
  porTipo.forEach((list, tipo)=>{
    const totalSec = sum(list.map(r=>r._sec));
    const media = avg(list.map(r=>r._sec));
    const limite = pauseLimitSecFor(tipo, list[0]?.setor);
    const alertOnly = pauseIsAlertOnly(tipo);
    const excedentes = limite ? list.filter(r=> r._sec > limite) : [];
    tipos.push({tipo, totalSec, media, limite, alertOnly, count:list.length, excedentesCount: excedentes.length,
      excedentesPct: list.length? excedentes.length/list.length : NaN});
  });
  return tipos.sort((a,b)=>b.totalSec-a.totalSec);
}
function computePausasPorSetor(rows){
  const porSetor = groupBy(rows, r=>r.setor||"—");
  const out = [];
  porSetor.forEach((list, setor)=>{
    const totalSec = sum(list.map(r=>r._sec));
    const agentes = new Set(list.map(r=>r.agente)).size;
    let excedentesCount = 0;
    list.forEach(r=>{ const lim = pauseLimitSecFor(r.tipo, r.setor); if(lim && r._sec>lim) excedentesCount++; });
    out.push({setor, totalSec, media: list.length? totalSec/list.length : NaN, count:list.length, agentes,
      excedentesPct: list.length? excedentesCount/list.length : NaN});
  });
  return out.sort((a,b)=>b.totalSec-a.totalSec);
}
function computePausasPorAgente(rows){
  const porAgente = groupBy(rows, r=>r.agente||"—");
  const out = [];
  porAgente.forEach((list, agente)=>{
    const totalSec = sum(list.map(r=>r._sec));
    let excedentesCount = 0;
    list.forEach(r=>{ const lim = pauseLimitSecFor(r.tipo, r.setor); if(lim && r._sec>lim) excedentesCount++; });
    const porTipoAgente = groupBy(list, r=>r.tipo||"—");
    let tipoMaisUsado = "—", maxSec=-1;
    porTipoAgente.forEach((l2,tipo)=>{ const s=sum(l2.map(r=>r._sec)); if(s>maxSec){maxSec=s; tipoMaisUsado=tipo;} });
    out.push({agente, totalSec, count:list.length, excedentesCount, tipoMaisUsado});
  });
  return out.sort((a,b)=>b.totalSec-a.totalSec);
}

/* ---------- ABANDONO MENSAL (aba dedicada) ---------- */
function getAbandonFiltered(){
  const rows = state.rows.abandonment||[];
  return rows.map(r=>({...r, _date: parseDateFlexible(r.data), _taxa: computeAbandonRate(r)}))
    .filter(r=> state.filters.setor==="all" || (r.setor||"")===state.filters.setor);
}
function computeAbandonRate(r){
  const t = toNumber(r.taxa);
  if(!isFinite(t)) return NaN;
  return t>1 ? t/100 : t;
}

/* ---------- RANKING GERAL DE AGENTES ---------- */
function buildAgentRanking(category){
  const received = getReceivedFiltered();
  const made = getMadeFiltered();
  const sats = getSatFiltered();
  const mons = getMonFiltered();

  const agentSet = new Set();
  received.forEach(r=>{ if(r.agente) agentSet.add(r.agente); });
  made.forEach(r=>{ if(r.agente) agentSet.add(r.agente); });
  sats.forEach(r=>{ if(r.agente) agentSet.add(r.agente); });
  mons.forEach(r=>{ if(r.agente) agentSet.add(r.agente); });

  const byRec = groupBy(received, r=>r.agente||"—");
  const byMade = groupBy(made, r=>r.agente||"—");
  const bySat = groupBy(sats, r=>r.agente||"—");
  const byMon = groupBy(mons, r=>r.agente||"—");

  const list = Array.from(agentSet).map(agente=>{
    const recList = byRec.get(agente)||[];
    const madeList = byMade.get(agente)||[];
    const sList = (bySat.get(agente)||[]).filter(r=>isFinite(r._nota));
    const mList = (byMon.get(agente)||[]).filter(r=>isFinite(r._nota));
    const total = recList.length + madeList.length;
    const csat = sList.length ? sList.filter(r=>r._nota>=4).length/sList.length : NaN;
    const notaMonMedia = mList.length ? avg(mList.map(r=>r._nota)) : NaN;
    let score;
    if(category==="geral") score = total + (isFinite(csat)?csat*20:0) + (isFinite(notaMonMedia)?notaMonMedia*20:0);
    else if(category==="recebidas") score = recList.length;
    else if(category==="realizadas") score = madeList.length;
    else if(category==="satisfacao") score = isFinite(csat)? csat*100 : -1;
    else if(category==="monitoria") score = isFinite(notaMonMedia)? notaMonMedia*100 : -1;
    return {agente, total, recebidas:recList.length, realizadas:madeList.length, csat, notaMonMedia, score};
  });
  return list.filter(a=>a.score>=0 || category==="geral").sort((a,b)=>b.score-a.score);
}

  const bySatSetor = groupBy(sats, r=>r.setor||"—");
  const byMonSetor = groupBy(mons, r=>r.setor||"—");
  const byPauseSetor = groupBy(pauses, r=>r.setor||"—");

  const rows = setores.map(s=>{
    const rm = computeReceivedMetrics(byRecSetor.get(s)||[]);
    const mm = computeMadeMetrics(byMadeSetor.get(s)||[]);

    const mon = computeMonitoria(byMonSetor.get(s)||[]);
    const pauseList = byPauseSetor.get(s)||[];
    const pauseTotal = sum(pauseList.map(r=>r._sec));
    const volume = (byRecSetor.get(s)||[]).length + (byMadeSetor.get(s)||[]).length + chatCount;
    return {setor:s, volume, ...rm, tmaComb: avg([rm.tma, mm.tma].filter(isFinite)), csat:sat.csat, notaMon:mon.media, pauseTotal};
  }).sort((a,b)=>b.volume-a.volume);

  return `
  <div class="section-title"><span class="chev">›</span> Comparativo entre setores</div>

const RANK_TABS = [

function rankRow(a, i){
  const pos = i+1;
  const cls = pos===1?"top1":pos===2?"top2":pos===3?"top3":"";
  const initials = (a.agente||"?").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  let scoreDisplay;
  if(rankingCategory==="satisfacao"||rankingCategory==="monitoria") scoreDisplay = isFinite(a.score)&&a.score>=0 ? a.score.toFixed(1)+"%" : "—";
  else scoreDisplay = fmtNum(a.score);
  const badgeLabel = pos<=3 ? `${pos}º Colocado` : `${pos}º lugar`;
  return `<div class="rank-row ${cls}">
    <div class="rank-pos">${pos}</div>
    <div class="rank-avatar">${initials}</div>
    <div class="rank-info">
      <div class="rank-name">${esc(a.agente)}</div>

      <div class="rank-badge">${badgeLabel}</div>

}

/* ============================================================
   TELA: DETALHADO
   ============================================================ */
function renderDetail(){
  const rec = getReceivedFiltered().map(r=>({...r, _canal:"Receptivo"}));
  const made = getMadeFiltered().map(r=>({...r, _canal:"Ativo"}));
  const chatRows = getChatFiltered().map(r=>({...r, _canal:"Chat"}));

  const byKey = groupBy([...rec.filter(r=>r._date), ...made.filter(r=>r._date), ...chatRows.filter(r=>r._date)],
    r=> [r.setor||"—", r.agente||"—", r._canal, monthKey(r._date)].join("|"));

  let rows = Array.from(byKey, ([key, list])=>{
    const [setor,agente,canal,mes] = key.split("|");
    const volume = list.length;
    let extra = {};
    if(canal==="Receptivo") extra = computeReceivedMetrics(list);
    else if(canal==="Ativo") extra = computeMadeMetrics(list);
    return {setor, agente, canal, mes, volume, ...extra};
  });

  const tid = "tblDetail";
  const ss = sortState[tid];
  if(ss){
    rows.sort((a,b)=>{
      const va=a[ss.col], vb=b[ss.col];
      if(typeof va==="string") return ss.dir*String(va).localeCompare(String(vb));
      return ss.dir*((va||0)-(vb||0));
    });
  } else {
    rows.sort((a,b)=>b.volume-a.volume);
  }

  return `
  <div class="section-title"><span class="chev">›</span> Todos os indicadores — por mês, setor, agente e canal</div>
  <div class="card">
    <div class="table-wrap"><table class="data-table" id="${tid}">
      <thead><tr>
        <th data-sort="mes">Mês</th><th data-sort="setor">Setor</th><th data-sort="agente">Agente</th><th data-sort="canal">Canal</th>
        <th data-sort="volume">Volume</th><th data-sort="pctAbandono">% Abandono</th><th data-sort="tma">TMA</th><th data-sort="tme">TME</th>
        <th data-sort="nivelServico">N. Serviço</th><th data-sort="rechamadas">Rechamadas</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td>${esc(r.mes)}</td><td>${esc(r.setor)}</td><td>${esc(r.agente)}</td><td>${esc(r.canal)}</td>
          <td>${fmtNum(r.volume)}</td>
          <td>${isFinite(r.pctAbandono)?fmtPct(r.pctAbandono):"—"}</td>
          <td>${isFinite(r.tma)?fmtSec(r.tma):"—"}</td>
          <td>${isFinite(r.tme)?fmtSec(r.tme):"—"}</td>
          <td>${isFinite(r.nivelServico)?fmtPct(r.nivelServico/100):"—"}</td>
          <td>${isFinite(r.rechamadas)?fmtNum(r.rechamadas):"—"}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>
    <p class="kpi-sub" style="margin-top:10px;">Clique nos títulos das colunas para ordenar. ${rows.length} linhas no período/filtro selecionado. Colunas específicas de fila (% Abandono, TME, N. Serviço, Rechamadas) só se aplicam ao canal Receptivo.</p>
  </div>
  `;
}

function configBlock(key){
  const sheet = SHEETS[key];
  const url = state.urls[key] || "";
  const headers = state.headers[key] || [];
  const mapping = state.mapping[key] || {};
  const rowCount = (state.raw[key]||[]).length;
  const status = rowCount>0 ? `<span class="sheet-status ok">✓ ${rowCount.toLocaleString('pt-BR')} registros carregados</span>` :
    (url ? `<span class="sheet-status empty">Ainda não carregado</span>` : `<span class="sheet-status empty">Sem link definido</span>`);

  return `
  <div class="config-block" data-sheet="${key}">
    <h3>${sheet.label} ${status}</h3>
    <p class="hint">${sheet.hint||""} Cole o link CSV publicado da aba "${sheet.label}" da sua planilha.</p>
    <div class="config-row">
      <input type="text" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv" data-url-input="${key}" value="${esc(url)}">
      <button class="btn btn-ghost btn-sm" data-load-btn="${key}">Carregar</button>
      <button class="btn btn-ghost btn-sm" data-paste-toggle="${key}">Colar CSV manualmente</button>
    </div>
    <textarea class="textarea-fallback" data-paste-area="${key}" placeholder="Cole aqui o conteúdo CSV se o link automático não funcionar (CORS)."></textarea>
    ${headers.length ? mappingUI(key, sheet, headers, mapping) : ""}
  </div>`;
}
function mappingUI(key, sheet, headers, mapping){
  return `<div class="map-grid">
    ${sheet.fields.map(f=>`
      <div class="map-field ${f.required?'':'optional'}">
        <label>${f.label}</label>
        <select data-map="${key}|${f.key}">
          <option value="">— não mapear —</option>
          ${headers.map(h=>`<option value="${esc(h)}" ${mapping[f.key]===h?'selected':''}>${esc(h)}</option>`).join("")}
        </select>
      </div>`).join("")}
  </div>`;
}
function renderRamalList(){
  const box = document.getElementById('ramalList');
  if(!box) return;
  const entries = Object.entries(state.ramalMap);
  box.innerHTML = entries.length ? `<div class="map-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:10px;">
    ${entries.map(([k,v])=>`<div class="pill pill-purple" style="display:flex;justify-content:space-between;gap:8px;padding:6px 10px;">
      <span>${esc(k)} → ${esc(v)}</span><span data-del-ramal="${esc(k)}" style="cursor:pointer;font-weight:800;">×</span>
    </div>`).join("")}
  </div>` : `<p class="kpi-sub" style="margin-bottom:10px;">Nenhum ramal cadastrado ainda.</p>`;
  box.querySelectorAll('[data-del-ramal]').forEach(el=>{
    el.addEventListener('click', ()=>{ delete state.ramalMap[el.dataset.delRamal]; saveConfig(); renderRamalList(); renderScreen(); });
  });
}

function bindConfigEvents(){
  renderRamalList();
  document.querySelectorAll('[data-url-input]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ state.urls[inp.dataset.urlInput] = inp.value; saveConfig(); });
  });
  document.querySelectorAll('[data-load-btn]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.loadBtn;
      const input = document.querySelector(`[data-url-input="${key}"]`);
      state.urls[key] = input.value;
      await loadSheetWithFeedback(key);
    });
  });
  document.querySelectorAll('[data-paste-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.pasteToggle;
      const ta = document.querySelector(`[data-paste-area="${key}"]`);
      ta.style.display = ta.style.display==="block" ? "none" : "block";
      if(ta.style.display==="block" && !ta.dataset.bound){
        ta.dataset.bound = "1";
        ta.addEventListener('change', ()=>{
          if(ta.value.trim()){
            loadPastedCsv(key, ta.value);
            normalizeSheetIfMapped(key);
            saveConfig();
            renderScreen();
          }
        });
      }
    });
  });
  document.querySelectorAll('[data-map]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const [key, field] = sel.dataset.map.split("|");
      if(!state.mapping[key]) state.mapping[key] = {};
      state.mapping[key][field] = sel.value || undefined;
      normalizeSheet(key);
      saveConfig();
      updateSidebarStatus();
    });
  });
  document.getElementById('btnAddRamal')?.addEventListener('click', ()=>{
    const k = document.getElementById('ramalKeyInput').value.trim();
    const v = document.getElementById('ramalValInput').value.trim();
    if(k && v){
      state.ramalMap[k] = v;
      saveConfig();
      document.getElementById('ramalKeyInput').value = "";
      document.getElementById('ramalValInput').value = "";
      renderRamalList();
    }
  });
  document.getElementById('btnLoadAll')?.addEventListener('click', loadAllSheets);
  document.getElementById('btnSaveConfig')?.addEventListener('click', ()=>{ saveConfig(); alert('Configuração salva.'); });
}
function normalizeSheetIfMapped(key){ if(state.mapping[key]) normalizeSheet(key); }

async function loadSheetWithFeedback(key){
  showLoading(`Carregando ${SHEETS[key].label}...`);
  const res = await fetchSheet(key);
  hideLoading();
  if(!res.ok){
    const ta = document.querySelector(`[data-paste-area="${key}"]`);
    if(ta) ta.style.display = "block";
    const block = document.querySelector(`.config-block[data-sheet="${key}"]`);
    if(block && !block.querySelector('.fetch-error-note')){
      const note = document.createElement('div');
      note.className = 'note-box warn fetch-error-note';
      note.innerHTML = `Não foi possível buscar esse link automaticamente (provavelmente CORS ou link não publicado). Use "Colar CSV manualmente" acima como alternativa.`;
      block.appendChild(note);
    }
  } else {
    normalizeSheetIfMapped(key);
    saveConfig();
  }
  renderScreen();
  updateSidebarStatus();
}
async function loadAllSheets(){
  showLoading("Carregando todas as fontes...");
  for(const key of Object.keys(SHEETS)){
    if(state.urls[key]) await fetchSheet(key);
  }
  normalizeAllSheets();
  saveConfig();
  hideLoading();
  renderScreen();
  updateSidebarStatus();
}
async function refreshAllData(){ await loadAllSheets(); }

function showLoading(text){
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingOverlay').style.display = 'flex';
}
function hideLoading(){ document.getElementById('loadingOverlay').style.display = 'none'; }

function updateSidebarStatus(){
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const loaded = Object.keys(SHEETS).filter(k=>(state.raw[k]||[]).length>0);
  if(loaded.length===0){ dot.className='status-dot off'; text.textContent='Nenhuma fonte conectada'; }
  else if(loaded.length<Object.keys(SHEETS).length){ dot.className='status-dot warn'; text.textContent=`${loaded.length}/${Object.keys(SHEETS).length} fontes conectadas`; }
  else { dot.className='status-dot'; text.textContent='Todas as fontes conectadas'; }
}

/* Hook post-render chart builders */
const _origRenderScreen = renderScreen;
renderScreen = function(){
  _origRenderScreen();
  if(currentScreen==="overview" && hasAnyData()) afterRenderOverview();
  if(currentScreen==="sector" && hasAnyData()) afterRenderSector();
  if(currentScreen==="queue" && hasAnyData()) afterRenderQueue();
  if(currentScreen==="pause" && hasAnyData()) afterRenderPause();
};

/* ============================================================
   BOOTSTRAP
   ============================================================ */
async function initApp(){
  renderNav();
  goToScreen("config");
  await loadConfig();
  if(Object.keys(state.urls).length){
    await loadAllSheets();
    goToScreen(hasAnyData() ? "overview" : "config");
  } else {
    renderScreen();
  }
  updateSidebarStatus();
  document.getElementById('menuToggle').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('open');
  });
}
window.addEventListener('DOMContentLoaded', initApp);

</script>
